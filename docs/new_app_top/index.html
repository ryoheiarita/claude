<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<script src="../gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>App Top cards prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101010;
    --hero-h:615px;         /* Figma: Container 420 + 195 (2026-10-19 調整後) */
    --nav-h:112px;          /* Figma Navigation Bar: status 59 + gap 5 + toolbar 40 + pb 8 */
    --sheet-tint:rgba(0,0,0,.6);
    --sheet-blur:24px;
    --ff:"Figtree","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;}
  body{font-family:var(--ff);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100%;}
  a{color:inherit;text-decoration:none}

  /* phone frame */
  .phone{position:relative;width:390px;height:min(844px,calc(100vh - 32px));background:var(--bg);overflow:hidden;border-radius:44px;box-shadow:0 0 0 8px #1b1b1b,0 30px 80px rgba(0,0,0,.6);}
  @media (max-width:430px){
    body{display:block}
    .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
    /* SP 実機では端末のステータスバーがあるので、プロトタイプのステータスバー(59)を消して全体を上に詰める */
    :root{--sbcut:59px;--nav-h:53px;}
    .nav .status{display:none;}
    .phone .nav{padding-top:5px;}
  }
  .screen{position:absolute;inset:0;z-index:2;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .screen::-webkit-scrollbar{display:none}
  /* ---------- navigation bar (fixed, Figma "Navigation Bar") ---------- */
  .nav{
    position:absolute;top:0;left:0;right:0;height:var(--nav-h);z-index:10;pointer-events:none;
    display:flex;flex-direction:column;gap:5px;padding-bottom:8px;
    background:linear-gradient(to bottom, rgba(0,0,0,.58), rgba(0,0,0,0));
  }
  .status{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;height:59px;}
  .status .time{flex:1 1 0;min-width:0;height:22px;padding-top:2px;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"SF Pro Text","SF Pro","Helvetica Neue",var(--ff);font-weight:600;font-size:17px;line-height:22px;color:#fff;letter-spacing:-.2px;}
  .status .island{flex:none;width:125px;height:37px;border-radius:100px;}
  .status .levels{flex:1 1 0;min-width:0;height:22px;padding-top:1px;display:flex;align-items:center;justify-content:center;gap:7px;}
  .status .levels svg{display:block;flex:none;}
  .toolbar{display:flex;align-items:center;height:40px;}
  .toolbar .left{flex:1 1 0;min-width:0;display:flex;align-items:center;padding-left:24px;}
  .toolbar .left img{display:block;width:96px;height:28.714px;}
  .toolbar .right{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-right:24px;}
  .toolbar .pill,.toolbar .iconbtn{
    pointer-events:auto;cursor:pointer;flex:none;
    height:40px;border-radius:42px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.15);
    -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .toolbar .pill{padding:0 16px;font-weight:500;font-size:12px;line-height:16px;white-space:nowrap;}
  .toolbar .iconbtn{width:40px;} /* same 1px white 15% border as the pill */
  .toolbar .iconbtn svg{display:block;width:24px;height:24px;}
  .toolbar .avatar{pointer-events:auto;cursor:pointer;flex:none;width:40px;height:40px;border-radius:999px;overflow:hidden;}
  .toolbar .avatar img{display:block;width:100%;height:100%;object-fit:cover;}

  /* ---------- hero : fixed layer at the bottom of the stack (circle photo + artist block, both Figma exports) ---------- */
  /* --lift : 画面が低いときにチケット先行カードが必ず全部見えるよう、ヒーローとカードをまとめて持ち上げる量（JS） */
  .hero-wrap{position:absolute;top:0;left:0;right:0;height:var(--hero-h);z-index:0;overflow:hidden;transform:translateY(calc(-1 * (var(--lift,0px) + var(--sbcut,0px))));
    background:linear-gradient(to bottom, #070707 0, #101010 160px);}
  /* Figma "Mask group": 453px circle at (-28,-16) -> centre is 3.5px right of the frame centre; not clipped to 390 any more */
  .hero-wrap .circle{position:absolute;top:-16px;left:calc(50% + 3.5px - 226.5px);width:453px;height:453px;border-radius:50%;overflow:hidden;}
  /* Rectangle 59 (image fill) : 670.59x643.68 at (-126.19,-31.51) in frame coords -> relative to the circle */
  .hero-wrap .circle img{position:absolute;left:-98.2px;top:-15.51px;width:670.59px;height:643.68px;object-fit:cover;display:block;}
  /* artist slider + name pill : Figma "Frame 53" (14482:31934) を透過 PNG(3x) にしたもの。円の上に重ねる。
     白背景・黒背景の2枚の書き出し差分からアルファを復元（MCP の書き出しは背景が焼き込まれるため）。
     描画範囲（影込み）は Frame 53 の上 43px から 221px → top 377 = Container 420 - 43。 */
  .hero-wrap .lower{position:absolute;top:377px;left:calc(50% - 195px);width:390px;height:221px;display:block;}

  /* ---------- scrim : full-screen black 60% + blur, hidden under the card layer, fades in on scroll
     (same as the backdrop behind a bottom sheet being dragged up) ---------- */
  .scrim{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:var(--sheet-tint);
    -webkit-backdrop-filter:blur(var(--sheet-blur));backdrop-filter:blur(var(--sheet-blur));
    opacity:var(--p,0);              /* 0 at rest -> 1 as the cards travel up (set by JS) */
  }

  /* ---------- card layer : transparent scroller, spacer for the hero then the cards ---------- */
  .spacer{height:calc(var(--hero-h) - var(--lift,0px) - var(--sbcut,0px));}
  .sheet{
    position:relative;
    padding:0 16px 120px;
    min-height:100%;                 /* enough scroll range for the first card to reach the top */
    display:flex;flex-direction:column;gap:8px;
  }

  /* ---------- cards (Figma "Card") ---------- */
  .ccard{
    background:rgba(255,255,255,.08);
    -webkit-backdrop-filter:blur(32px);backdrop-filter:blur(32px);
    border-radius:16px;overflow:hidden;
    padding-bottom:16px;
    display:flex;flex-direction:column;gap:8px;
  }
  .chead{display:flex;align-items:center;gap:5px;padding:16px 16px 0;}
  .chead h2{flex:1 1 0;min-width:0;font-weight:600;font-size:16px;line-height:1.32;letter-spacing:-.32px;color:#fff;}
  .chead .trail{display:flex;align-items:center;justify-content:flex-end;flex:none;font-weight:400;font-size:14px;line-height:20px;color:rgba(255,255,255,.5);white-space:nowrap;}
  .chead .trail.link{color:rgba(255,255,255,.75);}
  .chead .trail svg{width:24px;height:24px;display:block;}
  .chead .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.5);flex:none;}
  .chead .pager{display:flex;gap:5px;align-items:center;flex:none;}
  .chead .pager i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);transition:background .2s;}
  .chead .pager i.on{background:#fff;}

  /* horizontal scroller inside a card */
  .hscroll{display:flex;gap:8px;padding:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:16px;scrollbar-width:none;}
  .hscroll::-webkit-scrollbar{display:none}
  .hscroll > *{scroll-snap-align:start;flex:none;}
  .hscroll::after{content:"";flex:none;width:8px;} /* trailing padding (end padding is dropped by overflow) */

  /* Calendar tile */
  .tile{
    width:326px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);
    display:flex;flex-direction:column;gap:4px;
  }
  .tile .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .badge{
    --c:rgba(255,255,255,.35);
    display:inline-flex;align-items:center;justify-content:center;
    padding:2px 8px;border-radius:12px;
    border:1px solid var(--c);background:color-mix(in srgb, var(--c) 8%, transparent);
    font-weight:400;font-size:14px;line-height:normal;letter-spacing:-.28px;color:#fff;white-space:nowrap;
  }
  .badge.cat-birthday{--c:#e60076;} .badge.cat-presale{--c:#3d8bff;} .badge.cat-ppv{--c:#a855f7;} /* Premium */ .badge.cat-fcopen{--c:#ffb300;}
  .tile .who{font-weight:400;font-size:14px;line-height:20px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .tile .ttl{font-weight:600;font-size:16px;line-height:22px;color:#fff;height:44px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
  .tile .when{font-weight:400;font-size:14px;line-height:17px;letter-spacing:-.28px;color:rgba(255,255,255,.5);white-space:nowrap;}

  /* thumbnail + info row (LIVE / News / New Contents) */
  .item{display:flex;align-items:center;gap:12px;}
  .thumb{flex:none;width:120px;height:68px;border-radius:8px;overflow:hidden;background:#222;}
  .thumb img{display:block;width:100%;height:100%;object-fit:cover;}
  .info{flex:1 1 0;min-width:0;display:flex;flex-direction:column;}
  .info .ttl{font-weight:600;font-size:16px;line-height:22px;color:#fff;height:45px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;}
  .info .who{font-weight:400;font-size:14px;line-height:20px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vlist{display:flex;flex-direction:column;gap:12px;padding:0 16px;}
  /* チケット先行タイムライン（Figma 14842:3 / 単体版 ticket_card.html） */
  .ccard[hidden]{display:none;}
  /* パターン切替コントローラー : PC はスマホ枠の右上外、スマホ幅は画面下に浮かせる */
  .ctrl{position:fixed;top:16px;right:16px;z-index:100;display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:14px;
    background:rgba(40,40,40,.92);box-shadow:0 8px 24px rgba(0,0,0,.5);font-family:var(--ff);}
  .ctrl-ttl{font-size:11px;line-height:14px;color:rgba(255,255,255,.5);padding:0 2px;}
  .ctrl button{display:flex;align-items:center;gap:8px;border:0;border-radius:10px;padding:8px 12px 8px 8px;background:rgba(255,255,255,.08);
    color:rgba(255,255,255,.8);font:500 13px/16px var(--ff);cursor:pointer;text-align:left;white-space:nowrap;}
  .ctrl button b{display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:6px;background:rgba(255,255,255,.12);font-size:11px;}
  .ctrl button.on{background:#fff;color:#000;}
  .ctrl button.on b{background:#000;color:#fff;}
  /* SP : 浮かせずにページの一番下（カードの後ろ）に置く（JS で #sheet の末尾へ移動） */
  @media (max-width:430px){
    .ctrl{position:static;align-self:center;flex-direction:row;align-items:center;gap:6px;margin:16px auto 32px;padding:6px;border-radius:100px;}
    .ctrl-ttl{display:block;padding:0 4px 0 8px;}
    .ctrl button{padding:6px 10px 6px 6px;border-radius:100px;font-size:12px;}
  }
  /* チケット先行サマリー : 受付中/受付前を漏れなく、アーティストごとに1行。イベント名は省き、残り日数だけ見せる */
  .tk-sum{display:flex;flex-direction:column;padding:4px 0 6px;}
  .tk-sum[hidden],.tk[hidden]{display:none;}
  /* 全体の件数 : 見出し「チケット先行」の右 */
  .chead .total{display:inline-flex;gap:10px;margin-left:10px;vertical-align:1px;font-weight:400;font-size:12px;line-height:16px;letter-spacing:0;color:rgba(255,255,255,.6);}
  .chead .total b{font-weight:600;color:#fff;margin-left:3px;}
  .chead .total b.hot{color:#ff6b72;}
  .tk-sum .row{display:flex;align-items:center;gap:8px;min-height:44px;padding:6px 16px;border-top:1px solid rgba(255,255,255,.06);}
  .tk-sum .who{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .tk-sum .row.more{min-height:32px;}
  /* 複数件ある行 : イベント名は … で切り、右に「他n件」を必ず残す */
  .tk-sum .row .ev{display:flex;min-width:0;}
  .tk-sum .evn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tk-sum .oth{flex:none;margin-left:2px;}
  .tk-sum .ev{font-size:11px;line-height:14px;color:rgba(255,255,255,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}   /* 代表イベント名 */
  .tk-sum .cnt{margin-left:6px;font-weight:400;font-size:11px;color:rgba(255,255,255,.5);}   /* 件数 : アーティスト名の右 */
  .tk-sum .row .nm{min-width:0;font-weight:600;font-size:13px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* 右端 : 上に「あと n 日」、下に締切日（受付前は開始日） */
  .tk-sum .st{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none;white-space:nowrap;font-size:11px;line-height:14px;color:rgba(255,255,255,.6);}
  .tk-sum .bdg{flex:none;}
  .tk-sum .bdg{font-size:11px;line-height:14px;padding:1px 6px;border-radius:9px;border:1px solid #c10007;background:rgba(193,0,7,.08);color:#fff;}
  .tk-sum .bdg.pre{border-color:#6a7282;background:rgba(106,114,130,.08);}
  .tk-sum .num{flex:none;display:flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.14);font-weight:600;font-size:11px;line-height:1;color:#fff;}   /* 件数 */
  .tk-sum .cd{font-weight:600;font-size:12px;line-height:16px;color:#fff;}
  .tk-sum .cd.hot{color:#ff6b72;}                 /* 締切3日以内 */
  .tk-sum .sub{color:rgba(255,255,255,.45);}
  .tk-sum .empty{padding:4px 16px 0;font-size:12px;color:rgba(255,255,255,.5);}
  .ccard.ticket{padding-bottom:0;gap:4px;}
  .ccard.ticket .chead{padding-top:12px;}
  .ccard.ticket .chead h2{font-size:14px;line-height:20px;letter-spacing:-.28px;}  /* View All と同じ 14px */
  .tk{position:relative;--dw:26px;--axh:34px;--bh:54px;--g:4px;}
  .tk::after{content:"";position:absolute;top:0;right:0;bottom:0;width:32px;pointer-events:none;background:linear-gradient(90deg,rgba(31,31,31,0),rgba(31,31,31,.85));}
  .tk-sc{overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;}
  .tk-sc::-webkit-scrollbar{display:none}
  .tk-sc.drag{cursor:grabbing;}
  .tk-track{position:relative;height:calc(var(--axh) + 1px + var(--g) + 2*var(--bh) + var(--g) + var(--g));} /* 段数に応じて JS で上書き */
  .tk-day{position:absolute;top:0;bottom:0;width:var(--dw);}
  .tk-day.we{background:rgba(255,255,255,.03);}
  .tk-day .lbl{position:absolute;top:2px;left:1px;right:1px;height:calc(var(--axh) - 4px);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;line-height:13px;}
  .tk-day .w{color:rgba(255,255,255,.45);}
  .tk-day .d{font-weight:600;color:rgba(255,255,255,.85);}
  .tk-day.today .lbl{background:#fff;}
  .tk-day.today .w{color:rgba(0,0,0,.6);}
  .tk-day.today .d{color:#000;}
  /* 表示範囲に予定が無いとき、右端に「次の予定」ボタン（その予定の色の角丸＋日付＋→） */
  .tk-next{position:absolute;right:8px;z-index:2;display:flex;align-items:center;gap:2px;height:24px;padding:0 4px 0 10px;border:0;border-radius:100px;
    font:600 11px/1 var(--ff);color:#fff;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.4);
    opacity:0;pointer-events:none;transform:translateX(6px);transition:opacity .2s,transform .2s;}
  .tk-next.on{opacity:1;pointer-events:auto;transform:none;}
  .tk-next svg{width:16px;height:16px;display:block;}
  .tk-next .l{display:none;}
  .tk-next.left{right:auto;left:8px;padding:0 10px 0 4px;transform:translateX(-6px);}
  .tk-next.left.on{transform:none;}
  .tk-next.left .l{display:block;}
  .tk-next.left .r{display:none;}
  .tk-axis{position:absolute;left:0;right:0;top:var(--axh);height:1px;background:rgba(255,255,255,.1);}
  .tk-now{position:absolute;top:var(--axh);bottom:0;width:2px;background:#ff454d;}
  /* 文字の張り付きは CSS sticky（JS で動かすと横スクロールに 1 フレーム遅れてガクつくため）。
     sticky を効かせるため overflow は hidden ではなく clip。バー右端で切れる文字は --solid（バー色の不透明換算）へのグラデで消す */
  .tk-bar{position:absolute;height:var(--bh);border-radius:10px;overflow:clip;padding:6px 6px 6px 10px;}
  .tk-bar::after{content:"";position:absolute;top:0;right:0;bottom:0;width:20px;pointer-events:none;background:linear-gradient(90deg,transparent,var(--solid));}
  .tk-bar.pre{border:1px dashed currentColor;}
  .tk-bar.end{opacity:.45;}                     /* 受付終了 */
  .tk-lbl{position:absolute;height:var(--bh);}            /* 短いバーの右外ラベル */
  .tk-lbl .txt{position:absolute;inset:6px 0;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .tk-lbl.end{opacity:.45;}
  .tk-empty{position:absolute;left:16px;top:calc(var(--axh) + 16px);font-size:12px;color:rgba(255,255,255,.5);}
  /* 表示範囲の左端+4 に張り付く。sticky は親(バー)の中でしか動けないので、文字は中身の幅（最大240）にしてバー内を滑らせる */
  .tk-bar .txt{position:sticky;left:4px;display:flex;flex-direction:column;gap:4px;min-width:0;width:fit-content;max-width:min(100%,240px);}
  .tk-bar .tt,.tk-lbl .tt{font-weight:600;font-size:11px;line-height:13px;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .tk-bar .dt,.tk-lbl .dt{font-size:11px;line-height:13px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .hscroll.news{gap:12px;}
  .hscroll.news .item{width:310px;}
  .live .item{padding:0 16px;}
  .live .info{flex:none;width:190px;}

  /* ---------- debug guides (?guide=1) ---------- */
  .guides{display:none;position:absolute;inset:0;z-index:20;pointer-events:none;}
  .guides.on{display:block}
  .guides i{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,80,80,.7);}
  .guides i::after{content:attr(data-l);position:absolute;right:6px;top:-14px;font-size:10px;color:rgba(255,80,80,.9);font-family:var(--ff)}
</style>
</head>
<body>
<!-- パターン切替コントローラー（プロトタイプ用）: チケット先行カードの A/B -->
<div class="ctrl" id="ctrl" role="group" aria-label="チケット先行カードのパターン">
  <span class="ctrl-ttl">チケット先行</span>
  <button type="button" data-v="list"><b>A</b>リスト</button>
  <button type="button" data-v="timeline"><b>B</b>横カレンダー2列</button>
</div>
<div class="phone">
  <header class="nav">
    <div class="status">
      <div class="time">9:18</div>
      <div class="island"></div>
      <div class="levels">

(function lift(){
  const root = document.documentElement, sc = document.getElementById('screen');
  const MARGIN = 16;                                   // カード下と画面下端の余白
  const update = () => {
    const card = document.querySelector('.ccard.ticket');
    if (!card) return;
    const cur = parseFloat(root.style.getPropertyValue('--lift')) || 0;
    const bottom = card.getBoundingClientRect().bottom - sc.getBoundingClientRect().top + sc.scrollTop + cur; // lift 0 のときの下端
    const next = Math.max(0, Math.ceil(bottom + MARGIN - sc.clientHeight));
    if (next !== cur) { root.style.setProperty('--lift', next + 'px'); window.dispatchEvent(new Event('lift')); }
  };
  update();
  window.addEventListener('resize', update);
  document.fonts && document.fonts.ready.then(update);
})();

// ---------- Calendar tiles : next events from calendar-bmsg.tokyo data (assets/events.js) ----------

// ---------- snap : any scroll from the top brings the card layer to 32px under the logo header ----------
(function snap(){
  const sc = document.getElementById('screen');
  let SNAP = 0;                                         // card top at toolbar bottom (PC 104 / SP 45) + 32
  const setSnap = () => {
    const tb = document.querySelector('.toolbar').getBoundingClientRect().bottom - document.querySelector('.phone').getBoundingClientRect().top;
    SNAP = document.querySelector('.spacer').offsetHeight - (tb + 32);
  };
  window.addEventListener('resize', setSnap);
  setSnap(); window.addEventListener('lift', setSnap);
  let last = 0, timer = 0, quiet = 0, maxLock = 0, animating = false, locked = false, dir = 1, lastAbs = 0;

  // While locked the container is overflow:hidden, so trackpad momentum cannot move it at all
  // (Safari ignores preventDefault on momentum wheel events, so swallowing them is not enough).
  const lock = () => { locked = true; sc.style.overflowY = 'hidden'; };
  const unlock = () => { locked = false; sc.style.overflowY = ''; clearTimeout(quiet); clearTimeout(maxLock); };
  const armQuiet = () => { clearTimeout(quiet); quiet = setTimeout(unlock, 160); };

  const go = (top, fromWheel) => {
    dir = top > sc.scrollTop ? 1 : -1;
    animating = true; lock();
    sc.scrollTo({ top, behavior: 'smooth' });
    clearTimeout(timer);
    timer = setTimeout(() => {
      animating = false; sc.scrollTop = top; last = top;
      if (fromWheel) {                                  // keep blocking until the momentum ticks die down
        lastAbs = 1e9; armQuiet();
        clearTimeout(maxLock); maxLock = setTimeout(unlock, 900);
      } else unlock();                                  // touch: momentum already ended before we snapped
    }, 450);
  };

  sc.addEventListener('wheel', e => {
    if (animating) { e.preventDefault(); return; }
    if (locked) {
      const abs = Math.abs(e.deltaY);
      // momentum only ever decays: a growing or reversed delta is a new gesture -> release immediately
      const fresh = abs > lastAbs * 1.15 + 1 || Math.sign(e.deltaY) !== dir;
      lastAbs = abs;
      if (!fresh) { e.preventDefault(); armQuiet(); return; }
      unlock();
    }
    if (sc.scrollTop < 8 && e.deltaY > 0) { e.preventDefault(); go(SNAP, true); }
  }, { passive:false });

  sc.addEventListener('scroll', () => {
    const y = sc.scrollTop;
    if (!animating) dir = y > last ? 1 : y < last ? -1 : dir;
    last = y;
    if (animating || locked) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      const t = sc.scrollTop;
      if (t > 0 && t < SNAP) go(dir > 0 ? SNAP : 0, false);
    }, 80);
  }, { passive:true });
})();

// ---------- full-screen scrim fades in as the card layer travels up (bottom-sheet style) ----------
(function scrim(){
  const sc = document.getElementById('screen'), scrim = document.getElementById('scrim');
  const RANGE = 480;                                   // px of scroll until the scrim is fully on
  let raf = 0;
  const update = () => { raf = 0; scrim.style.setProperty('--p', Math.min(1, sc.scrollTop / RANGE).toFixed(3)); };
  sc.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive:true });
  update();
})();

// ---------- チケット先行タイムライン : 画像は見切れ、テキストは表示左端に張り付き右側を … 省略 ----------
// アーティストごとに段をまとめる。同じアーティストの予定が重なるときだけ、そのすぐ下の段に並べる。
// アーティストの並びは「受付中の締切が近い → 受付前の開始が近い → 終了」の順。maxLanes を超えるアーティストは載せない。
// perArtist : 1アーティストあたりの最大段数（TOP カードは 1。重なって入りきらない予定は presale.html で見る）
function packByArtist(items, maxLanes = Infinity, perArtist = Infinity) {
  const rank = it => it.status === 'on' ? [0, +it.e] : it.status === 'pre' ? [1, +it.s] : [2, -it.e];
  const groups = new Map();
  for (const it of [...items].sort((a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1]; })) {
    const k = it.artists[0];
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  const placed = [];
  let base = 0;
  for (const g of groups.values()) {
    const sub = [];                                                      // 段ごとの [left, right] 区間
    for (const it of [...g].sort((a, b) => a.L - b.L)) {
      let l = sub.findIndex(ivs => ivs.every(([a, b]) => it.R + 4 <= a || b + 4 <= it.L));
      if (l < 0) { l = sub.length; sub.push([]); }
      sub[l].push([it.L, it.R]); it.sub = l;
    }
    const need = Math.min(sub.length, perArtist, base === 0 ? maxLanes : Infinity);
    if (base + need > maxLanes) continue;
    for (const it of g) if (it.sub < need) { it.lane = base + it.sub; placed.push(it); }
    base += need;
  }
  return { items:placed, lanes:Math.max(1, base) };
}
// 表示範囲に予定が写っていない（端が 40px 未満しか見えない）とき、一番近い予定へ飛ぶボタンを出す。
// 右に予定があれば右端に「日付 ›」、右に無ければ左端に「‹ 日付」。色はその予定の色。
function nextButton(btn, items, s, V, onGo) {
  const ext = it => [it.L, it.L + it.W + (it.short ? 6 + 170 : 0)];
  const vis = items.some(it => { const [a, b] = ext(it); return Math.min(b, s + V) - Math.max(a, s) > 40; });
  const right = vis ? null : items.filter(it => ext(it)[0] >= s + V - 40).sort((a, b) => a.L - b.L)[0];
  const left = vis || right ? null : items.filter(it => ext(it)[1] <= s + 40).sort((a, b) => ext(b)[1] - ext(a)[1])[0];
  const t = right || left;
  btn.classList.toggle('on', !!t);
  if (!t) return;
  btn.classList.toggle('left', !right);
  const d = right ? t.s : t.e;                                           // 右=開始日、左=締切日
  btn.querySelector('span').textContent = `${d.getMonth() + 1}/${d.getDate()}`;
  btn.style.background = t.color;
  btn.onclick = () => onGo(Math.max(0, right ? t.L - 16 : ext(t)[1] - V * 0.7)); // 右=始まりを左端へ、左=終わりを右寄りに
}
// ---------- パターン切替 : A = チケット先行リスト(list) / B = 横カレンダー2列(timeline)。?view= > 前回の選択 > A ----------
const TICKET_VIEW = (() => {
  const q = new URLSearchParams(location.search).get('view');
  let v = q;
  if (!v) { try { v = localStorage.getItem('ticketView'); } catch (e) {} }
  return v === 'timeline' ? 'timeline' : 'list';
})();
(function controller(){
  const ctrl = document.getElementById('ctrl');
  // SP はページの一番下へ（PC はスマホ枠の外の右上に固定のまま）
  const place = () => {
    const sp = matchMedia('(max-width:430px)').matches, sheet = document.getElementById('sheet');
    if (sp && ctrl.parentElement !== sheet) sheet.appendChild(ctrl);
    if (!sp && ctrl.parentElement !== document.body) document.body.insertBefore(ctrl, document.body.firstChild);

  place();
  matchMedia('(max-width:430px)').addEventListener('change', place);
  for (const b of ctrl.querySelectorAll('button')) b.classList.toggle('on', b.dataset.v === TICKET_VIEW);
  ctrl.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.v === TICKET_VIEW) return;
    try { localStorage.setItem('ticketView', b.dataset.v); } catch (err) {}
    const u = new URL(location.href); u.searchParams.set('view', b.dataset.v); location.href = u.toString();   // 読み直して切り替え
  });
})();
// ---------- チケット先行サマリー（パターン A） ----------
(function ticketSummary(){
  const sum = document.getElementById('tkSum'), tl = document.querySelector('.ccard.ticket .tk');
  if (TICKET_VIEW === 'timeline') return;
  tl.hidden = true; sum.hidden = false;
  const NOW = new Date();
  const items = (window.PRESALES || []).map(p => ({ ...p, s:new Date(p.start), e:new Date(p.end) }))
    .map(p => ({ ...p, status: NOW < p.s ? 'pre' : NOW > p.e ? 'end' : 'on' }))
    .filter(p => p.status !== 'end');
  const on = items.filter(p => p.status === 'on').length, pre = items.length - on;
  // アーティストごと : 受付中(締切が近い順) → 受付前(開始が近い順)
  const key = p => p.status === 'on' ? +p.e : 1e15 + +p.s;
  const groups = new Map();
  for (const p of [...items].sort((a, b) => key(a) - key(b))) {
    const k = p.artists[0];
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(p);
  }
  const WD = ['日','月','火','水','木','金','土'], p2 = n => String(n).padStart(2, '0');
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const left = t => { const h = (t - NOW) / 36e5; return h < 24 ? `あと${Math.max(1, Math.ceil(h))}時間` : `あと${Math.ceil(h / 24)}日`; };
  // 行の右側 : 受付中なら「[受付中] n件 あと○日 MM/DD締切」、受付前だけなら「[受付前] MM/DD(曜) HH:MM 開始」
  // 行の左 : ステータスのバッジ
  const badge = ps => ps[0].status === 'on' ? `<span class="bdg">受付中</span>` : `<span class="bdg pre">受付前</span>`;
  // 行の右 : 上に「あと n 日」、下に締切日（受付前は開始まで / 開始日時）
  const status = ps => {
    const p = ps[0];                                                     // 受付中(締切が近い順) → 受付前
    if (p.status === 'on') {
      const hot = p.e - NOW < 3 * 864e5;
      return `<span class="cd${hot ? ' hot' : ''}">${left(p.e)}</span><span class="sub">${md(p.e)}(${WD[p.e.getDay()]}) 締切</span>`;
    }
    return `<span class="cd">${left(p.s)}</span><span class="sub">${md(p.s)}(${WD[p.s.getDay()]}) ${p2(p.s.getHours())}:${p2(p.s.getMinutes())} 開始</span>`;
  };
  if (items.length) document.querySelector('.ccard.ticket .chead h2').insertAdjacentHTML('beforeend',
    `<span class="total"><span>受付中<b class="hot">${on}</b></span><span>受付前<b>${pre}</b></span></span>`);
  let html = items.length ? '' : `<p class="empty">現在受付中・予定のチケット先行はありません</p>`;
  // 名前の下に代表イベント名 : 受付中を優先し、複数あれば締切が一番早いもの（無ければ開始が一番早い受付前）。ps はその順に並んでいる
  // 最大 MAX_ROWS 組まで行で出し、残りは「ほか n組」に名前だけまとめる（存在は必ず伝える）
  const MAX_ROWS = 3, list = [...groups];
  // 行を押すと、そのアーティストで絞り込んだ状態でチケット先行ページへ（presale.html?artist=…）
  const to = arts => 'presale.html?' + arts.map(a => 'artist=' + encodeURIComponent(a)).join('&');
  for (const [artist, ps] of list.slice(0, MAX_ROWS)) html += `<a class="row" href="${to([artist])}">${badge(ps)}` +
    `<span class="who"><span class="nm">${esc(artist)}<span class="cnt">${ps.length}件</span></span><span class="ev"><span class="evn">${esc(ps[0].title)}</span>${ps.length > 1 ? `<span class="oth">他${ps.length - 1}件</span>` : ''}</span></span><span class="st">${status(ps)}</span></a>`;
  const rest = list.slice(MAX_ROWS);
  if (rest.length) html += `<a class="row more" href="${to(rest.map(([a]) => a))}"><span class="who"><span class="ev">ほか${rest.length}組　${rest.map(([a, ps]) => `${esc(a)} ${ps.length}件`).join('・')}</span></span></a>`;
  sum.innerHTML = html;
  window.dispatchEvent(new Event('resize'));
})();

// バー色 × 透明度 を下地 #232323 に重ねた不透明色（右端グラデ用）
function solid(hex, a) { const n = parseInt(hex.slice(1), 16), b = parseInt('#232323'.slice(1), 16), m = (c, d) => Math.round(c * a + d * (1 - a));
  return `rgb(${m(n >> 16, b >> 16)},${m((n >> 8) & 255, (b >> 8) & 255)},${m(n & 255, b & 255)})`; }
(function ticketTimeline(){
  const DW = 26, X0 = 12, G = 4, AXH = 34, BH = 54, PAD = 6, TXT = 10;   // TXT = バー内テキストの左余白
  // 先行データ : calendar-bmsg.tokyo から tools/build_presales.mjs で生成した assets/presales.js
  const NOW = new Date();
  const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const TODAY = day0(NOW);
  const START = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, TODAY.getDate());   // 1ヶ月前からスクロール可能
  const FIRST_VISIBLE = new Date(TODAY.getTime() - 2 * 864e5);         // 初期表示の左端 = 2日前
  const COLORS = { 'BE:FIRST':'#145cfc', 'MAZZEL':'#8021ff', 'Aile The Shota':'#009e8f', 'HANA':'#e6007a', 'SKY-HI':'#f54a00',
                   'STARGLOW':'#c58000', 'Novel Core':'#00a640', 'REIKO':'#7f22fe', 'edhiii boi':'#6a7282', 'Ayumu Imazu':'#0092b8' };
  const p2 = n => String(n).padStart(2, '0');
  const fmt = d => `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
  const idx = d => Math.round((day0(d) - START) / 864e5);
  // TOP カードは受付中・受付前だけ。締切が近い順（受付中→受付前）に、最大 MAX_LANES 段へ入るぶんだけ載せる（全件は presale.html）
  const LBL = 170, MAX_LANES = 2;
  const SHORT_DAYS = 0;            // 期間がこの日数未満のバーは文字を右外に出す。いまは全バー枠内（0）。3日以内を外に出すなら 4
  const cand = (window.PRESALES || [])
    .map(p => ({ ...p, s:new Date(p.start), e:new Date(p.end) }))
    .map(p => ({ ...p, status: NOW < p.s ? 'pre' : NOW > p.e ? 'end' : 'on' }))
    .filter(p => p.status !== 'end')
    .sort((a, b) => (a.status === b.status ? 0 : a.status === 'on' ? -1 : 1) || (a.status === 'on' ? a.e - b.e : a.s - b.s));
  for (const it of cand) {
    it.L = X0 + idx(it.s) * DW + 2; it.W = (idx(it.e) - idx(it.s) + 1) * DW - 4;
    it.short = idx(it.e) - idx(it.s) + 1 < SHORT_DAYS;
    it.R = it.L + it.W + (it.short ? 6 + LBL : 0);
    it.color = COLORS[it.artists[0]] || '#6a7282';
    it.label = `${it.kind ? it.kind + ' ' : ''}${it.title}`;
    it.date = `${fmt(it.s)} – ${fmt(it.e)}`;
  }
  const packed = packByArtist(cand, MAX_LANES, 1);
  const ITEMS = packed.items;
  const laneEnds = ITEMS.map(it => it.R);
  const LANES = packed.lanes;
  const lastRight = Math.max(0, ...laneEnds);
  const yearEnd = new Date(TODAY.getFullYear(), 11, 31);                                   // 年末まで
  const DAYS = Math.max(idx(yearEnd) + 1, Math.ceil((lastRight - X0) / DW) + 2);
  const WD = ['日','月','火','水','木','金','土'];
  const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };
  const sc = document.getElementById('tkScroller'), track = document.getElementById('tkTrack');
  track.style.width = (X0 * 2 + DAYS * DW) + 'px';
  track.style.height = (AXH + 1 + G + LANES * (BH + G)) + 'px';

  let html = '';
  for (let i = 0; i < DAYS; i++) {
    const dt = new Date(START.getFullYear(), START.getMonth(), START.getDate() + i), w = dt.getDay(), d = dt.getDate();
    html += `<div class="tk-day${w === 0 || w === 6 ? ' we' : ''}${+dt === +TODAY ? ' today' : ''}" style="left:${X0 + i * DW}px">` +
            `<div class="lbl"><span class="w">${WD[w]}</span><span class="d">${d === 1 ? (dt.getMonth() + 1) + '/' : ''}${d}</span></div></div>`;
  }
  html += `<div class="tk-axis"></div><div class="tk-now" style="left:${X0 + idx(TODAY) * DW + DW / 2 - 1}px"></div>`;
  html += ITEMS.map(it => {
    const { L, W } = it, top = AXH + 1 + G + it.lane * (BH + G);
    const al = it.status === 'on' ? .9 : .2, bg = rgba(it.color, al);
    const txt = `<div class="txt"><p class="tt">${esc(it.label)}</p><p class="dt">${it.date}</p></div>`;
    return `<a class="tk-bar ${it.status}${it.short ? ' short' : ''}" href="${esc(it.link || '#')}" target="_blank" rel="noopener" data-l="${L}" data-w="${W}" ` +
           `style="left:${L}px;width:${W}px;top:${top}px;color:${it.color};background:${bg};--solid:${solid(it.color, al)}">${it.short ? '' : txt}</a>` +
           (it.short ? `<a class="tk-lbl ${it.status}" href="${esc(it.link || '#')}" target="_blank" rel="noopener" style="left:${L + W + 6}px;width:${LBL}px;top:${top}px">${txt}</a>` : '');
  }).join('');
  if (!ITEMS.length) html += `<p class="tk-empty">現在受付中・予定のチケット先行はありません</p>`;
  track.innerHTML = html;

  const nextBtn = sc.parentElement.querySelector('.tk-next');
  nextBtn.style.top = (AXH + 1 + G + (LANES * (BH + G)) / 2 - 12) + 'px';
  const bars = [...track.querySelectorAll('.tk-bar:not(.short)')].map(el => ({ L:+el.dataset.l, W:+el.dataset.w, txt:el.querySelector('.txt') }));
  const layout = () => {
    const s = sc.scrollLeft, viewL = s + G, viewR = s + sc.clientWidth - G;
    nextButton(nextBtn, ITEMS, s, sc.clientWidth, x => sc.scrollTo({ left:x, behavior:'smooth' }));
  };
  let raf = 0;
  sc.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; layout(); }); }, { passive:true });
  window.addEventListener('resize', layout);
  sc.scrollLeft = Math.round((FIRST_VISIBLE - START) / 864e5) * DW;
  layout();

  // PC: マウスドラッグで横スクロール（縦ホイールはページのスクロールに残す）
  let dragX = null, startS = 0, moved = false, pid = 0;
  sc.addEventListener('pointerdown', e => {
    if (e.pointerType !== 'mouse') return;
    dragX = e.clientX; startS = sc.scrollLeft; pid = e.pointerId;
  });
  sc.addEventListener('pointermove', e => {
    if (dragX === null) return;
    if (!moved && Math.abs(e.clientX - dragX) > 5) { moved = true; sc.classList.add('drag'); sc.setPointerCapture(pid); }  // クリックはリンクに通す
    sc.scrollLeft = startS - (e.clientX - dragX);
  });
  const end = () => { dragX = null; sc.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); };
  sc.addEventListener('pointerup', end);
  sc.addEventListener('pointercancel', end);
  sc.addEventListener('click', e => { if (moved) e.preventDefault(); }, true);   // ドラッグ後のリンク遷移を抑止
  sc.addEventListener('dragstart', e => e.preventDefault());

  window.dispatchEvent(new Event('resize'));                                         // 段数でカードの高さが変わるので lift を再計算
})();

if (new URLSearchParams(location.search).get('guide')) document.getElementById('guides').classList.add('on');
</script>
