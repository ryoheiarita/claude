<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<script src="../gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schedule sticky-date prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101010;
    --status-h:59px;        /* fixed status bar (image) */
    --mh-top:59px;          /* month header "2026.09" sticks right under the status bar */
    --mh-h:56px;            /* 24 + 24 (16px text, lh 1.5 = event title) + 8 */
    --day-top:115px;        /* day + weekday sticks here = mh-top + mh-h */
    --day-h:43px;           /* day 29 + weekday 14 */
    --ff:"Figtree","Noto Sans JP",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;}
  body{font-family:var(--ff);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100%;}

  /* phone frame */
  .phone{position:relative;width:390px;height:min(844px,calc(100vh - 32px));background:var(--bg);overflow:hidden;border-radius:44px;box-shadow:0 0 0 8px #1b1b1b,0 30px 80px rgba(0,0,0,.6);}
  @media (max-width:430px){
    body{display:block}
    .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
  }
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
  .screen::-webkit-scrollbar{display:none}
  .statusbar{position:absolute;top:0;left:0;width:390px;height:var(--status-h);z-index:10;pointer-events:none;
    background:url(assets/statusbar.png) center/390px 59px no-repeat;}
  @media (max-width:430px){ .statusbar{width:100%;background-size:100% auto;background-position:top left} }

  /* everything above the schedule is a flat image */
  .hero{display:block;width:100%;height:auto;}

  /* ---------- schedule ---------- */
  .sched{padding:0 0 120px;}

  /* one month = sticky header "2026.09" + rows
     - .mh   sticks inside .month  -> pushed up when the month ends (next month's header pushes it)
     - .day  sticks inside its .row -> pushed up (under the header) when the next day's row arrives */
  .month{position:relative;}
  .mh{
    position:sticky; top:var(--mh-top); z-index:3;
    display:flex;align-items:flex-end;
    height:var(--mh-h);padding:24px 16px 8px;
    background:var(--bg);
    font-weight:600;font-size:16px;line-height:1.5;color:#fff; /* same as event title */
  }
  .rows{padding:0 16px;}
  .row{display:flex;gap:8px;align-items:stretch;}

  /* day + weekday : sticks under the month header, pushed by the end of its own row */
  .day{
    position:sticky; top:var(--day-top); z-index:2;
    flex:none;align-self:flex-start;
    width:36px;height:var(--day-h);
    display:flex;flex-direction:column;align-items:center;
    white-space:nowrap;text-align:center;
  }
  .day .d{font-weight:600;font-size:24px;line-height:29px;color:#fff;}
  .day .w{font-weight:500;font-size:12px;line-height:14px;color:rgba(255,255,255,.5);}

  /* cards column : 8px bottom padding = row gap that belongs to the row (so labels touch when they push) */
  .cards{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:8px;}
  .card{
    display:flex;gap:8px;align-items:center;
    padding:15px;border-radius:8px;  /* 15 + 1px border = Figma 16 (stroke inside) */
    border:1px solid #3d3d3d;
    min-width:0;
  }
  .card.filled{background:#232323;border-color:#232323;}
  /* highlighted categories : tinted card + outlined label (BIRTHDAY follows calendar-bmsg.tokyo, the rest are BWU originals) */
  .card.hl{background:color-mix(in srgb, var(--c) 15%, transparent);border-color:transparent;}
  .card.hl .cat{border:1px solid var(--c);background:color-mix(in srgb, var(--c) 8%, transparent);}
  .cat-birthday{--c:#e60076;}
  .cat-birthday.card{background-image:url(assets/birthday.svg);background-repeat:no-repeat;background-position:calc(100% - 16px) 100%;}
  .cat-presale{--c:#3d8bff;}   /* ライブ先行 */
  .cat-ppv{--c:#a855f7;}       /* PPV */
  .cat-fcopen{--c:#ffb300;}    /* FC新規開設 */
  .card .details{flex:1 0 0;min-width:0;display:flex;flex-direction:column;gap:8px;}
  .card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .card .left{display:flex;align-items:center;gap:8px;flex:none;}
  .cat{
    display:inline-flex;align-items:center;justify-content:center;
    height:17.5px;padding:.5px 8px 0;border-radius:10px;
    background:rgba(255,255,255,.08);border:.8px solid rgba(255,255,255,.15);
    font-weight:500;font-size:11px;letter-spacing:-.132px;line-height:1;color:#fff;white-space:nowrap;
  }
  .time{font-weight:400;font-size:13px;color:rgba(255,255,255,.5);white-space:nowrap;}
  .right{display:flex;align-items:center;gap:8px;justify-content:flex-end;min-width:0;}
  .performer{font-weight:400;font-size:13px;color:rgba(255,255,255,.5); /* same as .time */white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .ext{flex:none;}
  .ext{width:16px;height:16px;display:block;}
  .title{
    font-weight:600;font-size:16px;line-height:1.5;color:#fff;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    max-height:48px;word-break:break-word;
  }
  .end{padding:24px 0 0;text-align:center;font-size:12px;color:rgba(255,255,255,.35);}

  /* ---------- debug guides (?guide=1) ---------- */
  .guides{display:none;position:absolute;inset:0;z-index:20;pointer-events:none;}
  .guides.on{display:block}
  .guides i{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,80,80,.7);}
  .guides i::after{content:attr(data-l);position:absolute;right:6px;top:-14px;font-size:10px;color:rgba(255,80,80,.9);font-family:var(--ff)}
</style>
</head>
<body>
<div class="phone">
  <div class="statusbar"></div>
  <div class="guides" id="guides">
    <i style="top:59px" data-l="status 59"></i>
    <i style="top:115px" data-l="day 115"></i>
    <i style="top:158px" data-l="day bottom 158"></i>
  </div>
  <div class="screen" id="screen">
    <img class="hero" src="assets/top.png" width="390" height="647" alt="">
    <div class="sched" id="sched"></div>
  </div>
</div>

<script src="assets/events.js"></script>
<script>
// ---------- real data: calendar-bmsg.tokyo, built by tools/build_events.mjs into assets/events.js ----------
const pad2 = n => String(n).padStart(2,'0');
const CAT_STYLE = { BIRTHDAY:'birthday', 'ライブ先行':'presale', PPV:'ppv', 'FC新規開設':'fcopen' };
const performerLabel = a => a.length === 1 ? a[0] : a.length === 2 ? `${a[0]} / ${a[1]}` : `${a[0]} 他${a.length - 1}組`;

function buildMonths(events){
  const months = [];
  let mo = null, day = null;
  for (const ev of events){
    const [y, m, d] = ev.date.split('-').map(Number);
    if (!mo || mo.y !== y || mo.m !== m){ mo = { y, m, days: [] }; months.push(mo); day = null; }
    if (!day || day.d !== d){ day = { d, events: [] }; mo.days.push(day); }
    day.events.push({
      cat: ev.cat,
      time: ev.allDay ? '' : `${ev.start} - ${ev.end}`,
      performer: performerLabel(ev.artists),
      title: ev.title,
      link: !!ev.link,
      href: ev.link,
    });
  }
  return months;
}

const ICON = `<svg class="ext" viewBox="0 0 16 16" fill="none"><path d="M12 12.6667H4C3.63333 12.6667 3.33333 12.3667 3.33333 12V4C3.33333 3.63333 3.63333 3.33333 4 3.33333H7.33333C7.7 3.33333 8 3.03333 8 2.66667C8 2.3 7.7 2 7.33333 2H3.33333C2.59333 2 2 2.6 2 3.33333V12.6667C2 13.4 2.6 14 3.33333 14H12.6667C13.4 14 14 13.4 14 12.6667V8.66667C14 8.3 13.7 8 13.3333 8C12.9667 8 12.6667 8.3 12.6667 8.66667V12C12.6667 12.3667 12.3667 12.6667 12 12.6667ZM9.33333 2.66667C9.33333 3.03333 9.63333 3.33333 10 3.33333H11.7267L5.64 9.42C5.38 9.68 5.38 10.1 5.64 10.36C5.9 10.62 6.32 10.62 6.58 10.36L12.6667 4.27333V6C12.6667 6.36667 12.9667 6.66667 13.3333 6.66667C13.7 6.66667 14 6.36667 14 6V2.66667C14 2.3 13.7 2 13.3333 2H10C9.63333 2 9.33333 2.3 9.33333 2.66667Z" fill="#fff"/></svg>`;

const WD = ['日','月','火','水','木','金','土'];
function render(months){
  const root = document.getElementById('sched');
  let html = '';
  for (const mo of months){
    html += `<section class="month"><div class="mh">${mo.y}.${pad2(mo.m)}</div><div class="rows">`;
    mo.days.forEach(day => {
      const wd = WD[new Date(mo.y, mo.m - 1, day.d).getDay()];
      html += `<div class="row"><div class="day"><span class="d">${pad2(day.d)}</span><span class="w">${wd}</span></div><div class="cards">`;
      for (const ev of day.events){
        const hl = CAT_STYLE[ev.cat];
        html += `<div class="card${ev.link?' filled':''}${hl?` hl cat-${hl}`:''}">
          <div class="details">
            <div class="row1">
              <div class="left"><span class="cat">${ev.cat}</span>${ev.time?`<span class="time">${ev.time}</span>`:''}</div>
              <div class="right"><span class="performer">${ev.performer}</span>${ev.link?ICON:''}</div>
            </div>
            <p class="title">${ev.title}</p>
          </div>
        </div>`;
      }
      html += `</div></div>`;
    });
    html += `</div></section>`;
  }
  html += `<div class="end">— end of schedule —</div>`;
  root.innerHTML = html;
}

render(buildMonths(window.EVENTS || []));

if (new URLSearchParams(location.search).get('guide')) document.getElementById('guides').classList.add('on');
</script>
</body>
</html>
