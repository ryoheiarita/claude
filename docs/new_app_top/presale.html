<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<script src="../gate.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>チケット先行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Figma「チケット先行 / B タイムライン（ガント）」14831:33458 */
  :root{
    --bg:#101010;
    --ff:"Figtree","Noto Sans JP",system-ui,sans-serif;
    --red:#ff454d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;}
  body{font-family:var(--ff);color:#fff;display:flex;align-items:center;justify-content:center;min-height:100%;}
  a{color:inherit;text-decoration:none}

  .phone{position:relative;width:390px;height:min(844px,calc(100vh - 32px));background:var(--bg);overflow:hidden;border-radius:44px;box-shadow:0 0 0 8px #1b1b1b,0 30px 80px rgba(0,0,0,.6);
    display:flex;flex-direction:column;}
  @media (max-width:430px){
    body{display:block}
    .phone{width:100%;height:100dvh;border-radius:0;box-shadow:none}
    .phone .status{display:none;}     /* SP 実機は端末のステータスバーがあるので消して上に詰める */
    .phone .bar{margin-top:5px;}
  }

  /* status bar (index.html と同じ) */
  .status{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;height:59px;flex:none;}
  .status .time{flex:1 1 0;min-width:0;height:22px;padding-top:2px;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"SF Pro Text","SF Pro","Helvetica Neue",var(--ff);font-weight:600;font-size:17px;line-height:22px;color:#fff;letter-spacing:-.2px;}
  .status .island{flex:none;width:125px;height:37px;border-radius:100px;}
  .status .levels{flex:1 1 0;min-width:0;height:22px;padding-top:1px;display:flex;align-items:center;justify-content:center;gap:7px;}
  .status .levels svg{display:block;flex:none;}

  /* toolbar : back + centered title (40px) */
  .bar{flex:none;height:40px;display:flex;align-items:center;gap:8px;padding:0 16px;}
  .bar a,.bar span{width:24px;height:24px;flex:none;display:block;}
  .bar svg{display:block;width:24px;height:24px;}
  .bar h1{flex:1 1 0;min-width:0;text-align:center;font-weight:600;font-size:17px;line-height:20px;}

  .scroll{flex:1 1 0;min-height:0;overflow-y:auto;scrollbar-width:none;}
  .scroll::-webkit-scrollbar{display:none}
  .content{padding:8px 16px 40px;display:flex;flex-direction:column;gap:16px;}


  /* timeline */
  /* 月日の帯(.tk-head)は縦スクロールで上に固定（sticky）。横位置はバー本体(.tk-sc)のスクロールに同期（JS）。
     sticky を効かせるため .tk 自体は overflow:hidden にしない */
  .tk{position:relative;border-radius:16px;background:rgba(255,255,255,.04);--axh:70px;--bh:54px;--g:4px;}
  .tk::after{content:"";position:absolute;top:0;right:0;bottom:0;width:40px;z-index:4;pointer-events:none;border-radius:0 16px 16px 0;background:linear-gradient(90deg,rgba(16,16,16,0),rgba(16,16,16,.9));}
  .tk-headwrap{position:sticky;top:0;z-index:3;background:var(--bg);}   /* 固定時に角丸のすき間から後ろのバーが見えないよう、ページ背景色の台に載せる */
  .tk-head{height:var(--axh);overflow:hidden;background:#1a1a1a;border-radius:16px 16px 0 0;box-shadow:0 1px 0 rgba(255,255,255,.1);}
  .tk-head-track{position:relative;height:100%;}
  .tk-sc{overflow-x:auto;overflow-y:auto;overscroll-behavior-y:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;cursor:grab;border-radius:0 0 16px 16px;}
  .tk-sc::-webkit-scrollbar{display:none}
  .tk-sc.drag{cursor:grabbing;}
  .tk-track{position:relative;}
  .tk-day{position:absolute;top:0;bottom:0;}
  .tk-day.we{background:rgba(255,255,255,.03);}
  .tk-head .tk-day.we{background:rgba(255,255,255,.02);}
  .tk-day .lbl{position:absolute;top:26px;left:1px;right:1px;height:38px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;}
  .tk-day .w{font-size:10px;line-height:12px;color:rgba(255,255,255,.45);}
  .tk-day .d{font-weight:600;font-size:12px;line-height:16px;color:rgba(255,255,255,.85);}
  .tk-day.today .lbl{background:#fff;}
  .tk-day.today .w{color:rgba(0,0,0,.6);}
  .tk-day.today .d{color:#000;}
  /* 月ラベル : 月ごとの区間の中で position:sticky。表示左端に張り付き、区間の終わり（次の月の1日）で押し出されて入れ替わる。
     JS で毎フレーム動かすとスクロールに遅れてずれるので CSS だけで止める */
  .tk-mon{position:absolute;top:6px;height:16px;padding-right:8px;}
  .tk-mon span{position:sticky;left:12px;display:inline-block;font-weight:600;font-size:12px;line-height:16px;color:#fff;white-space:nowrap;}
  .tk-now{position:absolute;top:0;bottom:0;width:2px;background:var(--red);}
  /* アーティスト名 : 各アーティストの段のまとまりの上に 10px、ブロックとの間は 2px。横スクロールでも左端に固定（sticky） */
  .tk-art{position:absolute;left:0;height:12px;}
  .tk-art.btn{height:34px;}                                   /* 名前12 + 2 + ボタン20 */
  /* 欄に何も写っていないとき、そのアーティストの受付中/受付前の予定へ飛ぶボタン。名前の下に置き、
     予定が未来なら右端（sticky right）、過去なら左端（sticky left）に揃える */
  .tk-go{display:none;position:sticky;right:8px;z-index:5;width:max-content;margin:2px 0 0 auto;align-items:center;gap:1px;height:20px;padding:0 4px 0 8px;border:0;border-radius:100px;
    font:600 10px/1 var(--ff);color:#fff;cursor:pointer;white-space:nowrap;}
  .tk-art.btn .tk-go{display:flex;}
  .tk-go svg{width:14px;height:14px;display:block;}
  .tk-go em{font-style:normal;}
  .tk-go .l{display:none;}
  .tk-go.left{left:12px;right:auto;margin-left:0;padding:0 8px 0 4px;}
  .tk-go.left .l{display:block;}
  .tk-go.left .r{display:none;}
  /* 横スクロールで写っている予定の段数に合わせて欄の高さが変わる（写っていなければ名前だけ残して閉じる） */
  .tk.anim .tk-bar,.tk.anim .tk-lbl,.tk.anim .tk-art{transition:top .25s ease;}
  .tk.anim .tk-track{transition:height .25s ease;}
  .tk-art span{position:sticky;left:12px;flex:none;display:block;width:max-content;height:12px;font-size:10px;line-height:12px;color:rgba(255,255,255,.45);white-space:nowrap;}
  .tk-bar{cursor:pointer;}
  .tk-bar{position:absolute;height:var(--bh);border-radius:10px;overflow:hidden;}
  .tk-bar.pre{border:1px dashed currentColor;}
  .tk-bar.end,.tk-lbl.end{opacity:.45;}
  .tk-bar .txt{position:absolute;top:6px;bottom:6px;display:flex;flex-direction:column;gap:4px;min-width:0;}   /* left/width は JS */
  .tk-lbl{position:absolute;height:var(--bh);}
  .tk-lbl .txt{position:absolute;inset:6px 0;display:flex;flex-direction:column;gap:4px;min-width:0;}
  .tt{font-weight:600;font-size:11px;line-height:13px;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .dt{font-size:11px;line-height:13px;color:rgba(255,255,255,.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hint{font-size:11px;line-height:13px;color:rgba(255,255,255,.4);text-align:center;margin-top:-4px;}

  /* list */
  h2{font-weight:600;font-size:17px;line-height:20px;}
  .list{display:flex;flex-direction:column;gap:8px;margin-top:-4px;}
  .item{position:relative;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;background:rgba(255,255,255,.08);}
  .item.end{opacity:.5;}
  .item .info{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;}
  .l1{display:flex;align-items:center;gap:8px;min-width:0;}
  .badge{flex:none;font-size:12px;line-height:14px;padding:2px 6px;border-radius:10px;border:1px solid #c10007;background:rgba(193,0,7,.08);}
  .badge.pre,.badge.end{border-color:#6a7282;background:rgba(106,114,130,.08);}
  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .who{font-size:13px;line-height:16px;color:rgba(255,255,255,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* アーティストはカード右上に固定・右揃え */
  .item .who,.dlg-card .who{position:absolute;top:14px;right:12px;max-width:45%;text-align:right;}
  .dlg-card .who{top:22px;right:20px;}
  .cd{font-weight:600;font-size:12px;line-height:14px;color:rgba(255,255,255,.9);white-space:nowrap;}
  .cd.hot{color:var(--red);}
  .item .ttl{font-weight:600;font-size:15px;line-height:20px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .l3{display:flex;gap:8px;font-size:12px;line-height:14px;color:rgba(255,255,255,.6);white-space:nowrap;}
  .l3 b{font-weight:600;color:rgba(255,255,255,.9);}
  .l3 b.hot{color:var(--red);}
  .empty{font-size:13px;color:rgba(255,255,255,.5);}

  /* 予定タップのダイアログ */
  .dlg{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);}
  .dlg[hidden]{display:none;}
  .dlg-card{position:relative;width:100%;border-radius:20px;background:#1f1f1f;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .dlg .kind{font-size:13px;line-height:18px;color:rgba(255,255,255,.7);}
  .dlg .ttl{font-weight:600;font-size:17px;line-height:24px;overflow-wrap:anywhere;margin-top:-8px;}
  .dlg dl{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;line-height:18px;padding:12px;border-radius:12px;background:rgba(255,255,255,.06);}
  .dlg dt{color:rgba(255,255,255,.5);white-space:nowrap;}
  .dlg dd b{font-weight:600;}
  .dlg dd b.hot{color:var(--red);}
  .dlg .btns{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
  .dlg .go{display:block;text-align:center;font-weight:600;font-size:15px;line-height:20px;padding:12px;border-radius:100px;background:#fff;color:#000;}
  .dlg .close{border:0;background:none;color:rgba(255,255,255,.7);font:400 14px/20px var(--ff);padding:8px;cursor:pointer;}
</style>
</head>

      <svg width="19.2" height="12.23" viewBox="0 0 19.2 12.2264" fill="none"><path fill-rule="evenodd" clip-rule="evenodd" d="M19.2 1.14623C19.2 0.513183 18.7224 0 18.1333 0H17.0667C16.4776 0 16 0.513183 16 1.14623V11.0802C16 11.7132 16.4776 12.2264 17.0667 12.2264H18.1333C18.7224 12.2264 19.2 11.7132 19.2 11.0802V1.14623ZM11.7659 2.44528H12.8326C13.4217 2.44528 13.8992 2.97078 13.8992 3.61902V11.0527C13.8992 11.7009 13.4217 12.2264 12.8326 12.2264H11.7659C11.1768 12.2264 10.6992 11.7009 10.6992 11.0527V3.61902C10.6992 2.97078 11.1768 2.44528 11.7659 2.44528ZM7.43411 5.09433H6.36745C5.77834 5.09433 5.30078 5.62652 5.30078 6.28301V11.0377C5.30078 11.6942 5.77834 12.2264 6.36745 12.2264H7.43411C8.02322 12.2264 8.50078 11.6942 8.50078 11.0377V6.28301C8.50078 5.62652 8.02322 5.09433 7.43411 5.09433ZM2.13333 7.53962H1.06667C0.477563 7.53962 0 8.06421 0 8.71132V11.0547C0 11.7018 0.477563 12.2264 1.06667 12.2264H2.13333C2.72244 12.2264 3.2 11.7018 3.2 11.0547V8.71132C3.2 8.06421 2.72244 7.53962 2.13333 7.53962Z" fill="#fff"/></svg>

      <svg width="27.33" height="13" viewBox="0 0 27.328 13" fill="none"><rect opacity="0.35" x="0.5" y="0.5" width="24" height="12" rx="3.8" stroke="#fff"/><path opacity="0.4" d="M26 4.78113V8.8566C26.8047 8.51143 27.328 7.70847 27.328 6.81886C27.328 5.92926 26.8047 5.1263 26 4.78113" fill="#fff"/><rect x="2" y="2" width="21" height="9" rx="2.5" fill="#fff"/></svg>
    </div>
  </div>
  <div class="bar">
    <a href="index.html" aria-label="戻る"><svg viewBox="0 0 24 24" fill="none"><path d="M15 19L8 12L15 5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
    <h1>チケット先行</h1>
    <span></span>
  </div>
  <div class="scroll">
    <div class="content">
      <div class="tk" id="tk"><div class="tk-headwrap"><div class="tk-head" id="head"><div class="tk-head-track" id="headTrack"></div></div></div><div class="tk-sc" id="sc"><div class="tk-track" id="track"></div></div></div>
      <p class="hint">← 横スクロールで日付移動 →</p>

<script src="assets/presales.js?v=20261019"></script>
<script>
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const COLORS = { 'BE:FIRST':'#145cfc', 'MAZZEL':'#8021ff', 'Aile The Shota':'#009e8f', 'HANA':'#e6007a', 'SKY-HI':'#f54a00',
                 'STARGLOW':'#c58000', 'Novel Core':'#00a640', 'REIKO':'#7f22fe', 'edhiii boi':'#6a7282', 'Ayumu Imazu':'#0092b8' };
const WD = ['日','月','火','水','木','金','土'];
const p2 = n => String(n).padStart(2, '0');
const day0 = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const NOW = new Date(), TODAY = day0(NOW);
const START = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, TODAY.getDate());   // 1ヶ月前からスクロール可能
const short = d => `${d.getMonth() + 1}/${d.getDate()} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
const long = d => `${d.getMonth() + 1}.${p2(d.getDate())}(${WD[d.getDay()]}) ${p2(d.getHours())}:${p2(d.getMinutes())}`;
const left = t => { const h = (t - NOW) / 36e5; return h < 24 ? `あと${Math.max(1, Math.ceil(h))}時間` : `あと${Math.ceil(h / 24)}日`; };

const ALL = (window.PRESALES || []).map(p => {
  const s = new Date(p.start), e = new Date(p.end);
  return { ...p, s, e, status: NOW < s ? 'pre' : NOW > e ? 'end' : 'on',
    color: COLORS[p.artists[0]] || '#6a7282',
    label: `${p.kind ? p.kind + ' ' : ''}${p.title}` };
});

// 「あと n 日」: 受付中=締切まで（赤）、受付前=開始まで。ステータスの右に置く
const countdown = p => p.status === 'on' ? `<b class="cd hot">${left(p.e)}</b>` : p.status === 'pre' ? `<b class="cd">${left(p.s)}</b>` : '';
// ---------- list : 受付中(締切順) → 受付前(開始順)、終了は別見出し ----------
const item = p => {
  const label = { on:'受付中', pre:'受付前', end:'受付終了' }[p.status];
  const l3 = p.status === 'on'  ? `<span>締切 ${long(p.e)}</span>`
           : p.status === 'pre' ? `<span>開始 ${long(p.s)}</span>`
           : `<span>${long(p.e)} 終了</span>`;
  return `<a class="item ${p.status}" href="${esc(p.link || '#')}" target="_blank" rel="noopener">
    <div class="info">
      <div class="l1"><span class="badge ${p.status}">${label}</span>${countdown(p)}</div><span class="who">${esc(p.artists.join(' / '))}</span>
      <p class="ttl">${esc(p.label)}</p>
      <div class="l3">${l3}</div>${p.result ? `<div class="l3"><span>当選発表 ${long(new Date(p.result))}頃</span></div>` : ''}
    </div></a>`;
};
const live = [...ALL.filter(p => p.status === 'on').sort((a, b) => a.e - b.e), ...ALL.filter(p => p.status === 'pre').sort((a, b) => a.s - b.s)];
const ended = ALL.filter(p => p.status === 'end' && p.e >= new Date(TODAY.getTime() - 30 * 864e5)).sort((a, b) => b.e - a.e);
document.getElementById('list').innerHTML = live.length ? live.map(item).join('') : '<p class="empty">現在受付中・予定のチケット先行はありません</p>';
document.getElementById('endList').innerHTML = ended.map(item).join('');
document.getElementById('endHead').hidden = !ended.length;

// ---------- timeline : 画像は見切れ、テキストは表示左端に張り付き右側を … 省略 ----------
const tk = document.getElementById('tk'), sc = document.getElementById('sc'), track = document.getElementById('track');
const head = document.getElementById('head'), headTrack = document.getElementById('headTrack');
const X0 = 12, G = 4, AXH = 70, HDR = 14, BH = 54,   // HDR = アーティスト名(12) + ブロックとの間(2)
      PAD = 6, TXT = 10, LBL = 170;
// 期間がこの日数未満のバーは文字を右外に出す。いまは全バー枠内（0）。3日以内を外に出すなら 4
const SHORT_DAYS = 0;
let bars = [], tlItems = [], tlGroups = [];

function build(DW) {
  const idx = d => Math.round((day0(d) - START) / 864e5);
  for (const it of ALL) {
    it.L = X0 + idx(it.s) * DW + 2; it.W = (idx(it.e) - idx(it.s) + 1) * DW - 4;
    it.short = idx(it.e) - idx(it.s) + 1 < SHORT_DAYS;
    it.R = it.L + it.W + (it.short ? 6 + LBL : 0);
  }
  const { items, lanes, groups } = packByArtist(ALL.filter(p => p.e >= START));
  // アーティストのまとまりごとに名前の帯(HDR)を挟む。段 l の上端 = 帯の数ぶん下げる
  const groupTop = [];                                                   // 各まとまりの名前の帯の上端
  // 上のブロック ─2px─ アーティスト名(12) ─2px─ 下のブロック（同じアーティスト内の段の間は G）
  let y = 2;
  for (const g of groups) { groupTop.push(y); y += HDR + g.count * BH + (g.count - 1) * G + 2; }
  y += G - 2;                                                            // 一番下の余白
  const laneTop = l => { const gi = groups.findIndex(g => l >= g.base && l < g.base + g.count); return groupTop[gi] + HDR + (l - groups[gi].base) * (BH + G); };
  const bodyH = Math.max(y, BH + 2 * G);
  const laneEnds = items.map(it => it.R);
  const yearEnd = new Date(TODAY.getFullYear(), 11, 31);                                   // 年末まで
  const days = Math.max(idx(yearEnd) + 1, Math.ceil((Math.max(0, ...laneEnds) - X0) / DW) + 2);
  track.style.width = (X0 * 2 + days * DW) + 'px';
  track.style.height = bodyH + 'px';
  headTrack.style.width = track.style.width;

  // 月日の帯（固定）
  let hh = '', html = '';
  const months = [];
  for (let i = 0; i < days; i++) {
    const dt = new Date(START.getFullYear(), START.getMonth(), START.getDate() + i), w = dt.getDay(), d = dt.getDate();
    const cls = `tk-day${w === 0 || w === 6 ? ' we' : ''}${+dt === +TODAY ? ' today' : ''}`, pos = `left:${X0 + i * DW}px;width:${DW}px`;
    hh += `<div class="${cls}" style="${pos}"><div class="lbl"><span class="w">${WD[w]}</span><span class="d">${d}</span></div></div>`;
    if (w === 0 || w === 6) html += `<div class="tk-day we" style="${pos}"></div>`;
    if (i === 0 || d === 1) months.push({ x:X0 + i * DW, label:`${dt.getMonth() + 1}月` });
  }
  months.forEach((m, k) => { m.end = k + 1 < months.length ? months[k + 1].x : X0 + days * DW; });
  hh += months.map(m => `<div class="tk-mon" style="left:${m.x}px;width:${m.end - m.x}px"><span>${m.label}</span></div>`).join('');
  headTrack.innerHTML = hh;
  // 本体 : 土日の帯・今日の線・アーティスト名・バー
  html += `<div class="tk-now" style="left:${X0 + idx(TODAY) * DW + DW / 2 - 1}px"></div>`;
  const GO = '<svg class="l" viewBox="0 0 24 24" fill="none"><path d="M14 7l-5 5 5 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><em></em><svg class="r" viewBox="0 0 24 24" fill="none"><path d="M10 7l5 5-5 5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  html += groups.map((g, gi) => `<div class="tk-art" style="top:${groupTop[gi]}px;width:${X0 * 2 + days * DW}px"><span>${esc(g.artist)}</span><button class="tk-go" type="button" aria-label="${esc(g.artist)}の予定へ">${GO}</button></div>`).join('');
  html += items.map((it, i) => {
    const top = laneTop(it.lane);
    const bg = it.status === 'on' ? rgba(it.color, .9) : rgba(it.color, .2);
    const txt = `<div class="txt"><p class="tt">${esc(it.label)}</p><p class="dt">${short(it.s)} – ${short(it.e)}</p></div>`;
    return `<div class="tk-bar ${it.status}${it.short ? ' short' : ''}" role="button" tabindex="0" data-i="${i}" data-l="${it.L}" data-w="${it.W}" ` +
           `style="left:${it.L}px;width:${it.W}px;top:${top}px;color:${it.color};background:${bg}">${it.short ? '' : txt}</div>` +
           (it.short ? `<div class="tk-lbl ${it.status}" role="button" tabindex="0" data-i="${i}" style="left:${it.L + it.W + 6}px;width:${LBL}px;top:${top}px">${txt}</div>` : '');
  }).join('');
  if (!items.length) html += `<p class="empty" style="position:absolute;left:16px;top:16px">表示期間にチケット先行はありません</p>`;
  track.innerHTML = html;
  tlItems = items;
  // 縦の詰め直し用に、アーティストごとの要素を控える
  const artEls = track.querySelectorAll('.tk-art');
  groups.forEach((g, gi) => { g.el = artEls[gi]; g.items = items.filter(it => it.artists[0] === g.artist); });
  for (const el of track.querySelectorAll('.tk-bar')) { const it = items[+el.dataset.i]; it.el = el; it.lblEl = el.nextElementSibling && el.nextElementSibling.classList.contains('tk-lbl') ? el.nextElementSibling : null; }
  tlGroups = groups;
  bars = [...track.querySelectorAll('.tk-bar:not(.short)')].map(el => ({ L:+el.dataset.l, W:+el.dataset.w, txt:el.querySelector('.txt') }));
  sc.scrollLeft = Math.max(0, (idx(TODAY) - 2) * DW);       // 今日の2日前を左端に
  head.scrollLeft = sc.scrollLeft;
  tk.classList.remove('anim');
  layout();
  requestAnimationFrame(() => requestAnimationFrame(() => tk.classList.add('anim')));   // 初回は動かさない
}
// アーティストごとに段をまとめる。同じアーティストの予定が重なるときだけ、そのすぐ下の段に並べる。
// アーティストの並びは「受付中の締切が近い → 受付前の開始が近い → 終了」の順。maxLanes を超えるアーティストは載せない。
// perArtist : 1アーティストあたりの最大段数（TOP カードは 1。重なって入りきらない予定は presale.html で見る）
function packByArtist(items, maxLanes = Infinity, perArtist = Infinity) {
  const rank = it => it.status === 'on' ? [0, +it.e] : it.status === 'pre' ? [1, +it.s] : [2, -it.e];
  const groups = new Map();
  for (const it of [...items].sort((a, b) => { const x = rank(a), y = rank(b); return x[0] - y[0] || x[1] - y[1]; })) {
    const k = it.artists[0];
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(it);
  }
  const placed = [], groupsOut = [];
  let base = 0;
  for (const g of groups.values()) {
    const sub = [];                                                      // 段ごとの [left, right] 区間
    for (const it of [...g].sort((a, b) => a.L - b.L)) {
      let l = sub.findIndex(ivs => ivs.every(([a, b]) => it.R + 4 <= a || b + 4 <= it.L));
      if (l < 0) { l = sub.length; sub.push([]); }
      sub[l].push([it.L, it.R]); it.sub = l;
    }
    const need = Math.min(sub.length, perArtist, base === 0 ? maxLanes : Infinity);
    if (base + need > maxLanes) continue;
    for (const it of g) if (it.sub < need) { it.lane = base + it.sub; placed.push(it); }
    groupsOut.push({ artist:g[0].artists[0], color:g[0].color, base, count:need });
    base += need;
  }
  return { items:placed, lanes:Math.max(1, base), groups:groupsOut };
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
// アーティストの欄を、表示範囲に写っている段だけの高さに詰め直す
function vlayout(s, V) {
  let y = 2;
  for (const g of tlGroups) {
    const vis = g.items.filter(it => Math.min(it.R, s + V) - Math.max(it.L, s) > 0);
    const subs = [...new Set(vis.map(it => it.sub))].sort((a, b) => a - b);
    g.el.style.top = y + 'px';
    const top0 = y + HDR;
    for (const it of g.items) {
      const k = Math.max(0, subs.indexOf(it.sub));                       // 写っていない段は先頭の段に重ねておく（画面外なので見えない）
      const t = top0 + k * (BH + G) + 'px';
      it.el.style.top = t;
      if (it.lblEl) it.lblEl.style.top = t;
    }
    const n = subs.length;
    // 何も写っていなければ、受付中/受付前の予定のうち一番近いものへのボタンを欄に出す
    const live = n ? [] : g.items.filter(it => it.status !== 'end');
    const right = live.filter(it => it.L >= s + V).sort((a, b) => a.L - b.L)[0];
    const leftT = right ? null : live.filter(it => it.R <= s).sort((a, b) => b.R - a.R)[0];
    const t = right || leftT;
    g.el.classList.toggle('btn', !!t);
    if (t) {
      const btn = g.el.querySelector('.tk-go'), d = right ? t.s : t.e;    // 右=開始日、左=締切日
      btn.classList.toggle('left', !right);
      btn.querySelector('em').textContent = `${d.getMonth() + 1}/${d.getDate()}`;
      btn.style.background = t.color;
      btn.onclick = e => { e.stopPropagation(); sc.scrollTo({ left:Math.max(0, right ? t.L - 16 : t.R - V * 0.7), behavior:'smooth' }); };
    }
    y += n ? HDR + n * BH + (n - 1) * G + 2 : (t ? 34 : 12) + 2;       // 0段 = 名前(12)、ボタンありは 名前の下にボタン(2+20)
  }
  y += G - 2;
  track.style.height = Math.max(y, 40) + 'px';
}
function layout() {
  const s = sc.scrollLeft, viewL = s + G, viewR = s + sc.clientWidth - G;
  vlayout(s, sc.clientWidth);
  for (const b of bars) {
    const right = Math.min(b.L + b.W - PAD, viewR);
    const lft = Math.min(Math.max(b.L + TXT, viewL), right);
    b.txt.style.left = (lft - b.L) + 'px';
    b.txt.style.width = Math.max(0, right - lft) + 'px';
  }
}
let raf = 0;
sc.addEventListener('scroll', () => {
  head.scrollLeft = sc.scrollLeft;                          // 月日の帯を同期（遅れないよう即時）
  if (!raf) raf = requestAnimationFrame(() => { raf = 0; layout(); });
}, { passive:true });
head.addEventListener('wheel', e => { if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) { sc.scrollLeft += e.deltaX; e.preventDefault(); } }, { passive:false });
window.addEventListener('resize', layout);

build(26);                                                  // 2週間表示（1日 26px）のみ

// カレンダー本体の高さ（固定）: ページを開いたとき、下の一覧が 1.5 枚ぶん画面に入る高さ。超えた分はカレンダーの中で縦スクロール。
// 段が詰まって中身が低くなっても高さは変えない（土日の帯・今日の線は下端まで伸ばす）
function fitTimeline() {
  const page = document.querySelector('.scroll'), first = document.querySelector('#list .item');
  if (!first) return;
  sc.style.height = 'auto'; track.style.minHeight = '';
  const pageTop = page.getBoundingClientRect().top - page.scrollTop;          // ページ先頭の位置
  const scTop = sc.getBoundingClientRect().top - pageTop;                      // カレンダー本体の上端（ページ先頭から）
  const gapBelow = first.getBoundingClientRect().top - sc.getBoundingClientRect().bottom;   // 本体の下端 → 一覧1枚目
  const want = first.offsetHeight * 1.5 + 8;                                    // 一覧 1.5 枚ぶん（間 8px 込み）
  const h = Math.max(120, Math.floor(page.clientHeight - scTop - gapBelow - want));
  sc.style.height = h + 'px';
  track.style.minHeight = h + 'px';
}
fitTimeline();
window.addEventListener('resize', fitTimeline);
document.fonts && document.fonts.ready.then(fitTimeline);

// PC: マウスドラッグで横スクロール（クリックはリンクに通す）
let dragX = null, startS = 0, moved = false, pid = 0;
sc.addEventListener('pointerdown', e => { if (e.pointerType !== 'mouse') return; dragX = e.clientX; startS = sc.scrollLeft; pid = e.pointerId; });
sc.addEventListener('pointermove', e => {
  if (dragX === null) return;
  if (!moved && Math.abs(e.clientX - dragX) > 5) { moved = true; sc.classList.add('drag'); sc.setPointerCapture(pid); }
  sc.scrollLeft = startS - (e.clientX - dragX);
});
const end = () => { dragX = null; sc.classList.remove('drag'); setTimeout(() => { moved = false; }, 0); };
sc.addEventListener('pointerup', end);
sc.addEventListener('pointercancel', end);
sc.addEventListener('click', e => { if (moved) { e.preventDefault(); e.stopPropagation(); } }, true);   // ドラッグ後のタップは無視

// ---------- 予定タップでダイアログ ----------
const dlg = document.getElementById('dlg'), dlgCard = document.getElementById('dlgCard');
const STATUS = { on:'受付中', pre:'受付前', end:'受付終了' };
function openDialog(it) {
  dlgCard.innerHTML = `
    <div class="l1"><span class="badge ${it.status}">${STATUS[it.status]}</span>${countdown(it)}</div><span class="who">${esc(it.artists.join(' / '))}</span>
    ${it.kind ? `<p class="kind">${esc(it.kind)}</p>` : ''}
    <p class="ttl">${esc(it.title)}</p>
    <dl>
      <dt>受付期間</dt><dd>${long(it.s)} 〜<br>${long(it.e)}</dd>
      ${it.result ? `<dt>当選発表</dt><dd>${long(new Date(it.result))}頃</dd>` : ''}
    </dl>
    <div class="btns">
      ${it.link ? `<a class="go" href="${esc(it.link)}" target="_blank" rel="noopener">詳細ページを見る</a>` : ''}
      <button class="close" type="button">閉じる</button>
    </div>`;
  dlg.hidden = false;
}
const closeDialog = () => { dlg.hidden = true; };
track.addEventListener('click', e => { const b = e.target.closest('[data-i]'); if (b) openDialog(tlItems[+b.dataset.i]); });
track.addEventListener('keydown', e => { const b = e.target.closest('[data-i]'); if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDialog(tlItems[+b.dataset.i]); } });
dlg.addEventListener('click', e => { if (e.target === dlg || e.target.closest('.close')) closeDialog(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !dlg.hidden) closeDialog(); });
sc.addEventListener('dragstart', e => e.preventDefault());
</script>
</body>
</html>
