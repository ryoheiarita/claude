<!DOCTYPE html>
<!--
  Tab Bar 260726 — BwU (phone-frame demo)
  Source of truth: bwu/components/tabbar-260726 (BASELINE 2026-07-26)
    - 形 = checkin_motion のタブバー verbatim(中央HANA丸がバー上端から10pxはみ出す)
    - バー4アイコン + Moreメニュー3アイコン = animated iconsax Lottie
    - More タップ → Tabbar_set 322:1202 Opened: 白丸反転 + Check In / Gallery / Calendar 展開
    - 背景グラデ完全再現: 通常時 transparent 52.404%→rgba(0,0,0,.6) /
      展開時 #101010グラデ + 上に向かって消える background-blur 8px
  TABBAR CSS / MARKUP / JS はコンポーネントから verbatim スプライス。
  ⚠️ サイズ検証用ページなので desktop は縮小せず 1:1(定義値どおりの実寸)。
     ウィンドウが低い場合はページをスクロール。スマホは実機画面にフィット。
-->
<html lang="ja">
<head>
<script src="../gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Tab Bar — BwU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<script src="lottie-icons.js"></script>
<!-- 確定した微調整値(コンポーネントと同一ファイル)。これが無いと指定が外れる -->
<script src="tabbar-adjust.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{min-height:100%;}
  body{
    background:#050505;
    display:flex;justify-content:center;align-items:flex-start;
    padding:24px 0;overflow:auto;
    font-family:'Figtree','Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    -webkit-font-smoothing:antialiased;color:#fff;
  }
  /* 実機ではベゼル無し・画面いっぱい */
  body.mobile{padding:0;overflow:hidden;align-items:center;}

  /* ============ phone frame ============ */
  #phoneWrap{position:relative;margin:auto;}   /* margin:auto = 収まる時は中央、溢れる時は上詰め */
  #phone{
    position:relative;width:390px;height:844px;
    background:#101010;border-radius:47px;overflow:hidden;
    box-shadow:0 0 0 10px #1c1c1e,0 0 0 12px #3a3a3c,0 40px 90px rgba(0,0,0,.8);
  }
  body.mobile #phone{border-radius:0;box-shadow:none;}

  #docLink{
    position:fixed;top:20px;right:24px;z-index:99;
    background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);
    border:1px solid rgba(255,255,255,.15);border-radius:20px;
    padding:8px 16px;font-size:13px;font-family:inherit;cursor:pointer;
    backdrop-filter:blur(8px);transition:background .2s;text-decoration:none;
  }
  #docLink:hover{background:rgba(255,255,255,.16);}
  body.mobile #docLink{
    top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;
    padding:6px 12px;font-size:12px;
  }

  /* ============ demo content (scrolls under the bar) ============ */
  #scroller{
    position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  #scroller::-webkit-scrollbar{display:none;}
  .feed{padding:24px 16px 160px;}
  .feed h1{font-size:24px;font-weight:700;letter-spacing:-.4px;margin:8px 0 2px;}
  .feed .sub{font-size:13px;color:rgba(255,255,255,.45);margin-bottom:20px;}
  .hero{
    position:relative;height:180px;border-radius:20px;margin-bottom:16px;overflow:hidden;
    background:
      radial-gradient(140px 120px at 22% 30%, #ff2d78cc, transparent 65%),
      radial-gradient(180px 140px at 78% 22%, #2d8cffcc, transparent 65%),
      radial-gradient(200px 160px at 55% 90%, #28e0a8b3, transparent 65%),
      linear-gradient(135deg,#1b1b20,#101014);
  }
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tile{
    aspect-ratio:1/1.15;border-radius:16px;position:relative;overflow:hidden;
    border:1px solid rgba(255,255,255,.07);
  }
  .tile::after{
    content:"";position:absolute;left:12px;bottom:12px;right:40%;height:10px;border-radius:5px;
    background:rgba(255,255,255,.22);
  }
  .t1{background:linear-gradient(160deg,#812DFF88,#1a1a1f 70%);}
  .t2{background:linear-gradient(160deg,#FF673988,#1a1a1f 70%);}
  .t3{background:linear-gradient(160deg,#2d8cff77,#1a1a1f 70%);}
  .t4{background:linear-gradient(160deg,#ff2d7877,#1a1a1f 70%);}
  .t5{background:linear-gradient(160deg,#28e0a877,#1a1a1f 70%);}
  .t6{background:linear-gradient(160deg,#ffd36e66,#1a1a1f 70%);}

  /* ===== TABBAR — spliced verbatim from components/tabbar-260726 ===== */
/* checkin_motion は *{box-sizing:border-box} のグローバルリセット前提。
     コンポーネント単体でも同じ計算になるようスコープ付きで持つ。
     これが無いと bar が 64+14=78px に膨らみ、中央ボタンがはみ出さなくなる */
  .tabbar, .tabbar *, .tabbar-scrim{ box-sizing:border-box; }
  :root{
    --ff:'Figtree',-apple-system,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    --tabbar-bg:        rgba(0,0,0,0.65);
    --tabbar-border:    rgba(255,255,255,0.15);
    --tabbar-blur:      16px;
    --tabbar-radius:    42px;
    --tab-inactive:     rgba(255,255,255,0.5);
    --tab-active:       #ffffff;
    --tab-more-bg:      rgba(255,255,255,0.25);
    --tab-more-border:  rgba(255,255,255,0.15);
    --tab-more-blur:    8px;
    /* more menu (Tabbar_set 322:1202 / Opened) — 追加分 */
    --more-circle:      56px;             /* satellite circle */
    --more-pitch:       80px;             /* column pitch (circle 56 + gap 24) */
    --more-drop:        32px;             /* side columns sit lower than center */
    --more-gap:         12px;             /* menu bottom -> bar top */
    --more-item-bg:     rgba(0,0,0,0.65);      /* Figma 261:556: バーと同スタイル */
    --more-item-border: rgba(255,255,255,0.15);
    --more-item-blur:   16px;
  }
  .tabbar{
    position:absolute;left:50%;bottom:24px;transform:translateX(-50%);z-index:6;
    height:64px;padding:7px 20px;border-radius:var(--tabbar-radius);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    transition:opacity .3s ease;
  }
  .tabbar::before{
    content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;
    background:var(--tabbar-bg);border:1px solid var(--tabbar-border);
    backdrop-filter:blur(var(--tabbar-blur));-webkit-backdrop-filter:blur(var(--tabbar-blur));
  }
  .tabbar__row{position:relative;z-index:1;display:flex;gap:12px;align-items:flex-end;justify-content:center;}
  .tab-item{
    width:48px;padding:4px 0 2px;border:0;background:none;cursor:pointer;
    display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:flex-end;
    color:var(--tab-inactive);font-family:var(--ff);
  }
  .tab-item svg{width:24px;height:24px;display:block;fill:currentColor;}
  /* bar icons = animated iconsax Lottie(白ストローク焼き込み)。
     形は checkin_motion のまま: 24px box、inactive は opacity で 50% */
  .tabbar__row .tab-item__icon{width:24px;height:24px;position:relative;}
  .tab-item .tab-item__lottie{
    width:100%;height:100%;opacity:.5;transition:opacity .18s ease;
  }
  .tab-item.active .tab-item__lottie{opacity:1;}
  .tab-item__label{
    font-size:11px;line-height:15px;letter-spacing:0.11px;text-align:center;white-space:nowrap;
    color:currentColor;text-shadow:0 0 4px rgba(0,0,0,0.25);
  }
  .tab-item.active{color:var(--tab-active);}
  .tab-item.is-center{width:48px;height:75px;gap:2px;padding:0 0 2px;}
  .tab-item.is-center .tab-item__icon{
    width:48px;height:48px;border-radius:40px;
    display:flex;align-items:center;justify-content:center;
    background:var(--tab-more-bg);border:1px solid var(--tab-more-border);
    backdrop-filter:blur(var(--tab-more-blur));-webkit-backdrop-filter:blur(var(--tab-more-blur));
    transition:background .25s ease,border-color .25s ease;
  }
  .tab-item.is-center .ic-hana{width:48px;height:48px;}

  /* ---- 追加分: More opened (322:1202) — 丸が白反転、ロゴ黒 ---- */
  .tabbar.more-open .tab-item.is-center .tab-item__icon{ background:#fff; border-color:transparent; }
  .tab-item.is-center .ic-hana g{ transition:fill .25s ease, opacity .25s ease; }
  .tabbar.more-open .tab-item.is-center .ic-hana g{ fill:#000; opacity:1; }

  /* ---- 追加分: more menu (satellites above the bar) ---- */
  .more-menu{
    position:absolute;left:50%;bottom:calc(100% + var(--more-gap));
    transform:translateX(-50%);z-index:1;
    display:flex;align-items:flex-start;gap:calc(var(--more-pitch) - var(--more-circle));
    pointer-events:none;
  }
  .tabbar.more-open .more-menu{pointer-events:auto;}
  .more-item{
    width:var(--more-circle);border:0;background:none;padding:0;cursor:pointer;
    display:flex;flex-direction:column;gap:2px;align-items:center;
    color:var(--tab-active);font-family:var(--ff);
    opacity:0;transform:translateY(18px) scale(.55);transform-origin:50% 100%;
    transition:opacity .22s ease, transform .32s cubic-bezier(.34,1.56,.64,1);
    -webkit-tap-highlight-color:transparent;
  }
  .more-item:not(.is-mid){margin-top:var(--more-drop);}
  .tabbar.more-open .more-item{opacity:1;transform:translateY(0) scale(1);}
  .tabbar.more-open .more-item:nth-child(1){transition-delay:.03s;}
  .tabbar.more-open .more-item:nth-child(2){transition-delay:0s;}
  .tabbar.more-open .more-item:nth-child(3){transition-delay:.06s;}
  .more-item__circle{
    width:var(--more-circle);height:var(--more-circle);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:var(--more-item-bg);border:1px solid var(--more-item-border);
    backdrop-filter:blur(var(--more-item-blur));-webkit-backdrop-filter:blur(var(--more-item-blur));
  }
  .more-item .tab-item__icon{width:24px;height:24px;position:relative;}
  .more-item .tab-item__lottie{width:100%;height:100%;}
  .more-item .tab-item__lottie svg{display:block;}
  .more-item__label{
    font-size:11px;line-height:15px;letter-spacing:0.11px;text-align:center;white-space:nowrap;
    color:rgba(255,255,255,0.5);   /* Figma 261:558: white 50%, no shadow */
  }
  /* ---- 追加分: バー背景の黒透過グラデーション (322:1202 コンテナ背景の完全再現) ----
     通常時 (261:414): linear-gradient(transparent 52.404% -> rgba(0,0,0,0.6))、blurなし
     展開時 (316:1059): linear-gradient(rgba(16,16,16,0) -> #101010) + background-blur 8px
     ⚠️ 展開時のblurは「上に向かって透明になるblur」。Figmaのbackground-blurは
        レイヤー自身のアルファで変調される(グラデが透明な上側ではblurも効かない)ため、
        CSSでは blur層に同じアルファ勾配の mask を掛けて再現する。
     層構成(paint順): ::before=通常グラデ → __blur=マスク付きblur → ::after=展開グラデ */
  .tabbar-bg{
    position:absolute;left:0;right:0;bottom:0;height:268px;
    pointer-events:none;z-index:4;   /* グラデ4 < スクリム5 < バー6 */
  }
  .tabbar-bg::before{   /* Default (261:414) */
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0) 52.404%, rgba(0,0,0,0.6) 100%);
    opacity:1;transition:opacity .3s ease;
  }
  /* 上に向かって消えるblur。opacityでフェードすると合成レイヤー化でblurが飛ぶので、
     backdrop-filter の半径そのものを 0px -> 8px でアニメーションさせる。 */
  .tabbar-bg__blur{
    position:absolute;inset:0;
    backdrop-filter:blur(0px);-webkit-backdrop-filter:blur(0px);
    transition:backdrop-filter .3s ease,-webkit-backdrop-filter .3s ease;
    -webkit-mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 100%);
    mask-image:linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 100%);
  }
  .tabbar-bg.open .tabbar-bg__blur{
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .tabbar-bg::after{    /* Opened (316:1059) の色グラデ — blurの上に乗る */
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(16,16,16,0) 0%, #101010 100%);
    opacity:0;transition:opacity .3s ease;
  }
  .tabbar-bg.open::before{opacity:0;}
  .tabbar-bg.open::after{opacity:1;}

  /* click-outside catcher while open (transparent, sits UNDER the bar: z 5 < 6) */
  .tabbar-scrim{position:absolute;inset:0;z-index:5;display:none;}
  .tabbar-scrim.on{display:block;}

  /* per-icon fine-tune vars (set from JS; harmless defaults = 0/1) */
  /* ⚠️ .tab-item__lottie は span — display:block が無いと transform が描画に一切効かない
     (非置換インライン要素の transform は無視される。computed style には出るので気づきにくい) */
  .tab-item__lottie{ display:block; }
  .tab-item__icon > svg,
  .tab-item__icon > .tab-item__lottie{
    transform:translate(var(--adj-x,0px),var(--adj-y,0px)) scale(var(--adj-s,1));
  }
</style>
</head>

<div id="phoneWrap">
  <div id="phone">

    <!-- demo feed -->
    <div id="scroller">
      <div class="feed">
        <h1>Tab Bar 260726</h1>
        <div class="sub">More をタップ → メニュー展開(背景グラデ + 上に向かって消える blur)/ タブでアイコン再生</div>
        <div class="hero"></div>
        <div class="grid">
          <div class="tile t1"></div><div class="tile t2"></div>
          <div class="tile t3"></div><div class="tile t4"></div>
          <div class="tile t5"></div><div class="tile t6"></div>
          <div class="tile t2"></div><div class="tile t5"></div>
          <div class="tile t4"></div><div class="tile t1"></div>
        </div>
      </div>
    </div>

    <!-- ===== TABBAR (verbatim from component) ===== -->
    <div class="tabbar-bg" id="tabbarBg"><div class="tabbar-bg__blur"></div></div>
      <div class="tabbar-scrim" id="tabbarScrim"></div>
      <!-- TABBAR — bar verbatim from checkin_motion, Home active, center = More -->
      <nav class="tabbar" id="tabbar">
    
        <!-- 追加分: more menu (322:1202 Opened) : Check In / Gallery / Calendar -->
        <div class="more-menu" id="moreMenu">
          <button class="more-item" data-key="checkin">
            <span class="more-item__circle"><span class="tab-item__icon"><span class="tab-item__lottie"></span></span></span>
            <span class="more-item__label">Check In</span>
          </button>
          <button class="more-item is-mid" data-key="gallery">
            <span class="more-item__circle"><span class="tab-item__icon"><span class="tab-item__lottie"></span></span></span>
            <span class="more-item__label">Gallery</span>
          </button>
          <button class="more-item" data-key="calendar">
            <span class="more-item__circle"><span class="tab-item__icon"><span class="tab-item__lottie"></span></span></span>
            <span class="more-item__label">Calendar</span>
          </button>
        </div>
    
        <div class="tabbar__row">
          <button class="tab-item active" data-tab="0" data-key="home">
            <span class="tab-item__icon"><span class="tab-item__lottie"></span></span>
            <span class="tab-item__label">Home</span>
          </button>
    
          <button class="tab-item" data-tab="1" data-key="poppin">
            <span class="tab-item__icon"><span class="tab-item__lottie"></span></span>
            <span class="tab-item__label">Poppin'</span>
          </button>
    
          <!-- CENTER: More (frosted glass + HANA flower) — tap toggles the more menu -->
          <button class="tab-item is-center is-more" data-tab="2" data-key="more" id="tabCenter">
            <span class="tab-item__icon">

                <g opacity="0.75" fill="#fff">

<script>
/* ---------- phone frame fit ----------
   desktop: 1:1(縮小しない = 定義値どおりの実寸で検証できる)
   mobile : 実機画面にフィット(実機での見え方が正) */
(function(){
  const wrap = document.getElementById('phoneWrap');
  function fit(){
    const mobile = innerWidth <= 500;
    document.body.classList.toggle('mobile', mobile);
    if (mobile){
      const s = Math.min(innerWidth / 390, innerHeight / 844);
      wrap.style.transform = `scale(${s})`;
    } else {
      wrap.style.transform = 'none';
    }
  }
  addEventListener('resize', fit); fit();
})();
</script>

<script>
/* ===== TABBAR JS (verbatim from component) ===== */
window.Tabbar = (function(){
  const root = document.getElementById('tabbar');
  if(!root) return {};
  const scrim = document.getElementById('tabbarScrim');
  const bg = document.getElementById('tabbarBg');
  const items = Array.from(root.querySelectorAll('.tabbar__row .tab-item'));
  const moreItems = Array.from(root.querySelectorAll('.more-item'));
  const ICON_ALIAS = { poppin: 'talk' };   // data-key -> TABBAR_ICONS key
  const anims = {};   // key -> lottie animation (bar tabs + satellites)
  const starts = {};  // key -> first frame with actual motion (skip baked-in dead time)
  // iconsax の Lottie は冒頭に 160〜534ms の無動作フレームが焼き込まれている。
  // 最初のキーフレーム時刻を走査し、クリック時はそこから再生 = 即動き出す。
  function firstMotionFrame(data){
    let min = Infinity;
    (function walk(o){
      if (Array.isArray(o)){ o.forEach(walk); return; }
      if (o && typeof o === 'object'){
        if (o.a === 1 && Array.isArray(o.k) && o.k.length && typeof o.k[0].t === 'number')
          min = Math.min(min, o.k[0].t);
        for (const k in o) walk(o[k]);
      }
    })(data);
    return isFinite(min) ? min : 0;
  }
  [...items, ...moreItems].forEach(el => {
    const key = el.dataset.key;
    const holder = el.querySelector('.tab-item__lottie');
    if (!holder) return;   // center More = static HANA svg
    const data = window.TABBAR_ICONS[ICON_ALIAS[key] || key];
    starts[key] = firstMotionFrame(data);
    anims[key] = lottie.loadAnimation({
      container: holder,
      renderer: 'svg', loop: false, autoplay: false,
      animationData: data,
    });
  });
  function play(key){ const a = anims[key]; if(!a) return; a.goToAndPlay(starts[key] || 0, true); }
  function setActive(i){
    // center More keeps its checkin_motion look (label stays 50%) — never gets .active
    items.forEach((el, idx) => el.classList.toggle('active', idx === i && !el.classList.contains('is-center')));
    const key = items[i] && items[i].dataset.key;
    if (key) play(key);
  }
  function openMore(){
    root.classList.add('more-open');
    if (scrim) scrim.classList.add('on');
    if (bg) bg.classList.add('open');
    // play in sync with each satellite's pop (CSS transition-delay: mid 0s / sides .03s/.06s)
    const POP_DELAY = [30, 0, 60];
    moreItems.forEach((el, i) => setTimeout(() => play(el.dataset.key), POP_DELAY[i] ?? i * 40));
  }
  function closeMore(){
    root.classList.remove('more-open');
    if (scrim) scrim.classList.remove('on');
    if (bg) bg.classList.remove('open');
  }
  function toggleMore(){ root.classList.contains('more-open') ? closeMore() : openMore(); }
  /* 確定した微調整値(tabbar-adjust.js)を適用 — これが無いと調整値は
     localStorage 内にしか存在せず、公開ページでは反映されない(= 指定が外れる)。 */
  function applyAdjust(a){
    if (!a) return;
    if (a.global){
      const g = a.global, r = document.documentElement.style;
      if (g.circle != null) r.setProperty('--more-circle', g.circle + 'px');
      if (g.pitch  != null) r.setProperty('--more-pitch',  g.pitch  + 'px');
      if (g.drop   != null) r.setProperty('--more-drop',   g.drop   + 'px');
      if (g.mgap   != null) r.setProperty('--more-gap',    g.mgap   + 'px');
    }
    if (a.items){
      Object.keys(a.items).forEach(key => {
        const v = a.items[key];
        const holder = root.querySelector('[data-key="' + key + '"] .tab-item__icon');
        if (!holder || !v) return;
        holder.style.setProperty('--adj-x', (v.dx || 0) + 'px');
        holder.style.setProperty('--adj-y', (v.dy || 0) + 'px');
        holder.style.setProperty('--adj-s', (v.s == null ? 1 : v.s));
      });
    }
  }
  applyAdjust(window.TABBAR_ADJUST);
  const isAdjusting = () => document.body.classList.contains('adjusting');
  items.forEach((el, idx) => el.addEventListener('click', () => {
    if (el.classList.contains('is-center')) { toggleMore(); return; } // works in adjust mode too
    if (isAdjusting()) return;   // adjust tool owns item clicks
    setActive(idx);
  }));
  moreItems.forEach(el => el.addEventListener('click', () => {
    if (isAdjusting()) return;
    play(el.dataset.key);
    // navigation would go here; keep the menu open for the prototype
  }));
  if (scrim) scrim.addEventListener('click', closeMore);
  return { setActive, play, openMore, closeMore, toggleMore, applyAdjust, items, moreItems, anims };
})();
</script>
