<!DOCTYPE html>
<html lang="ja">
<head>
<script src="../gate.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Home Guide — BwU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --jp:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
    --ff:'Figtree', var(--jp);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:#050505;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--ff);-webkit-font-smoothing:antialiased;color:#fff;
    overflow:hidden;
  }

  /* ============ phone frame ============ */
  #phoneWrap{position:relative;}
  #phone{
    position:relative;width:390px;height:844px;
    background:#101010;border-radius:47px;overflow:hidden;
    box-shadow:0 0 0 10px #1c1c1e,0 0 0 12px #3a3a3c,0 40px 90px rgba(0,0,0,.8);
  }
  /* on a real phone: no bezel, fill the screen */
  body.mobile #phone{border-radius:0;box-shadow:none;}

  /* ============ background (static image) ============ */
  #bg{position:absolute;inset:0;}
  #bg img{width:100%;height:100%;object-fit:cover;display:block;}

  /* ============ guide overlay ============ */
  /* figma 6239:26911 — top scrim: black -> transparent, h339 */
  .scrim-top{
    position:absolute;left:0;top:0;width:390px;height:339px;
    background:linear-gradient(180deg,#000 0%,rgba(0,0,0,0) 100%);
  }
  /* figma 6239:26902 — bottom scrim: transparent -> black, top505 h339 */
  .scrim-bottom{
    position:absolute;left:0;top:505px;width:390px;height:339px;
    background:linear-gradient(180deg,rgba(0,0,0,0) 0%,#000 100%);
  }

  /* guide column: pill / icon / label (gap 8) */
  .guide{
    position:absolute;display:flex;flex-direction:column;gap:8px;align-items:center;
  }
  /* figma 6239:26913 — 下スワイプ column */
  .guide.top{left:92px;top:42px;width:207px;}
  /* figma 6239:26904 — 上スワイプ column */
  .guide.bottom{left:99px;top:684px;width:192px;}

  .guide .pill{
    background:#fff;border-radius:30px;padding:6px 16px;
    font-weight:600;font-size:14px;line-height:20px;color:#101010;text-align:center;
    white-space:nowrap;
  }
  .guide .label{
    font-weight:600;font-size:16px;line-height:22px;color:#fff;text-align:center;
    white-space:nowrap;
  }

  /* ============ animated icon (arrow + hand) ============ */
  .gicon{position:relative;width:76px;height:59px;}
  .gicon svg{position:absolute;inset:0;overflow:visible;display:block;}

  /* --- swipe DOWN (top guide) --- */
  /* arrow: draws downward (reveal top -> bottom), then fades */
  .gicon.down .arr{animation:arrDown 2.4s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes arrDown{
    0%   {clip-path:inset(0 0 100% 0);opacity:1;}
    14%  {clip-path:inset(0 0 100% 0);opacity:1;}
    50%  {clip-path:inset(0 0 0% 0);opacity:1;}
    74%  {clip-path:inset(0 0 0% 0);opacity:1;}
    88%  {clip-path:inset(0 0 0% 0);opacity:0;}
    100% {clip-path:inset(0 0 0% 0);opacity:0;}
  }
  /* hand: presses in, drags down, releases */
  .gicon.down .hand{animation:handDown 2.4s ease-in-out infinite;}
  @keyframes handDown{
    0%   {transform:translateY(-10px);opacity:0;}
    12%  {transform:translateY(-10px);opacity:1;animation-timing-function:cubic-bezier(.3,.7,.2,1);}
    52%  {transform:translateY(8px);opacity:1;}
    74%  {transform:translateY(8px);opacity:1;}
    88%  {transform:translateY(8px);opacity:0;}
    100% {transform:translateY(8px);opacity:0;}
  }

  /* --- swipe UP (bottom guide) --- */
  .gicon.up .arr{animation:arrUp 2.4s cubic-bezier(.4,0,.2,1) infinite;}
  @keyframes arrUp{
    0%   {clip-path:inset(100% 0 0 0);opacity:1;}
    14%  {clip-path:inset(100% 0 0 0);opacity:1;}
    50%  {clip-path:inset(0% 0 0 0);opacity:1;}
    74%  {clip-path:inset(0% 0 0 0);opacity:1;}
    88%  {clip-path:inset(0% 0 0 0);opacity:0;}
    100% {clip-path:inset(0% 0 0 0);opacity:0;}
  }
  .gicon.up .hand{animation:handUp 2.4s ease-in-out infinite;}
  @keyframes handUp{
    0%   {transform:translateY(10px);opacity:0;}
    12%  {transform:translateY(10px);opacity:1;animation-timing-function:cubic-bezier(.3,.7,.2,1);}
    52%  {transform:translateY(-8px);opacity:1;}
    74%  {transform:translateY(-8px);opacity:1;}
    88%  {transform:translateY(-8px);opacity:0;}
    100% {transform:translateY(-8px);opacity:0;}
  }

  /* ============ home indicator ============ */
  #homeIndicator{
    position:absolute;left:50%;bottom:8px;transform:translateX(-50%);
    width:134px;height:5px;border-radius:100px;background:#fff;z-index:9;
  }

  /* ============ entrance ============ */
  #guideLayer{opacity:0;transition:opacity .5s ease;}
  #guideLayer.in{opacity:1;}
</style>
</head>

<script>
(() => {
  /* ---------- fit phone to viewport (same as checkin_motion) ---------- */
  function fit(){
    const mobile = innerWidth <= 500;
    document.body.classList.toggle('mobile', mobile);
    const s = mobile
      ? Math.min(innerWidth / 390, innerHeight / 844)   // fullscreen, no bezel
      : Math.min((innerHeight - 48) / 868, (innerWidth - 48) / 414, 1.15);
    document.getElementById('phoneWrap').style.transform = `scale(${s})`;
  }
  addEventListener('resize', fit); fit();

  /* ---------- entrance: guide fades in over the home screen ---------- */
  setTimeout(() => document.getElementById('guideLayer').classList.add('in'), 300);
})();
</script>
